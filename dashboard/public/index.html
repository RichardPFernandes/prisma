// ---------------------------------------------------------------- detail
function stationState(r, key) {
  const st = r.nodes?.[key] || 'pending';
  const isCurrent = r.status !== 'committed' && r.node === key;
  if (isCurrent) {
    const kind = r.state?.status === 'pre-build-failed' ? 'waiting' : r.status === 'running' ? 'running' : r.status === 'failed' ? 'failed' : r.status === 'needs_human_review' ? 'blocked' : 'waiting';
    return { cls: `current ${kind}`, done: false };
  }
  return { cls: st === 'done' ? 'done' : '', done: st === 'done' };
}

function explanation(r) {
  const s = r.state || {};
  const node = NODE_LABEL[r.node] || r.node;
  const note = [...(s.agent_log || [])].reverse().find(a => a.note)?.note;
  if (s.status === 'pre-build-failed') {
    const n = (s.preBuildErrors || []).length;
    return { icon: 'alert', title: `A base não compila: o watcher parou antes do Implement (${n} erro${n === 1 ? '' : 's'} no mvn compile).`, body: 'O agente não foi despachado porque os erros já existiam antes de qualquer mudança dele. Corrija a base (merge/rebase com o fix): o watcher recompila sozinho quando o worktree mudar. Ou, se o próprio ticket é corrigir esses erros, responda no Redmine com um comentário começando por “aceito”. A lista está em “Validação de build”, abaixo.' };
  }
  if (s.status === 'spec-draft') {
    return { icon: 'alert', title: 'Spec rascunho gerada do ticket, aguardando sua revisão antes do /fetch-ticket.', body: s.spec_draft?.ai_sections?.length
      ? `O watcher montou ${s.spec_draft.spec_path || 'a spec'} com os campos do ticket, a IA sugeriu as seções que faltavam e o rascunho foi comentado no Redmine. Revise (principalmente o que veio da IA) e troque draft: true para draft: false no frontmatter. O watcher libera o ciclo no próximo tick.`
      : `O watcher montou ${s.spec_draft?.spec_path || 'a spec'} com os campos do ticket e comentou no Redmine. Solução e Critérios de Aceite não vieram do ticket: complete o que faltar e troque draft: true para draft: false no frontmatter. O watcher libera o ciclo no próximo tick.` };
  }
  if (s.status === 'authorization-pending') {
    const p = s.pending_authorization || {};
    return { icon: 'alert', title: `O agente pediu autorização para uma ação privilegiada (${p.id || 'pedido'}): ${p.kind === 'db_migration' ? 'aplicar SQL num banco compartilhado' : p.kind || ''}.`, body: 'O agente não aplica isso sozinho e o watcher não despacha nada até você decidir na caixa abaixo: Aprovar (o Prisma executa o SQL com hash conferido, em transação única, e verifica antes/depois), Recusar (o run volta para bloqueado com o motivo) ou Já apliquei manualmente. Mensagem livre não aprova.' };
  }
  if (s.status === 'handed_back_qa') {
    return { icon: 'info', title: 'Devolvido ao QA sem nova mudança de código.', body: 'O ticket foi para Ag Teste com o resumo e o run foi arquivado. Se o QA recusar de novo, use “Corrigir recusa QA”.' };
  }
  if (s.status === 'spec-change-rejected') {
    const p = s.spec_change_rejected || {};
    return { icon: 'alert', title: `SPEC_CHANGE ${p.id || ''} rejeitada${p.rejector ? ` por ${p.rejector}` : ''}. A spec não mudou.`, body: `O /implement propôs mudar ${p.ac_affected?.length ? p.ac_affected.join(', ') : 'um requisito funcional'} e a proposta foi rejeitada. O run fica parado até alguém decidir: responda na conversa dizendo como seguir (ex.: implementar só o que cabe na spec) e o watcher retoma o /implement, ou grave node="implement" e status="in_progress" no state.json.` };
  }
  if (s.status === 'plan-escalation') {
    return { icon: 'alert', title: `O plano ficou abaixo do score mínimo (${s.planScore ?? '—'}/100) mesmo depois dos re-plans automáticos.`, body: `O watcher parou antes do Implement e pediu revisão no ticket. Responda no Redmine com um comentário começando por “aceito” para seguir com este plano, ou ajuste a seção “Plano de execução” do handoff.md: o watcher reavalia a cada ciclo. Os pontos apontados estão em “Qualidade do plano”, abaixo.` };
  }
  if (s.status === 'churn-escalation') {
    const files = s.churnReport?.files || [];
    return { icon: 'alert', title: `Churn de implementação: ${files.length} arquivo${files.length === 1 ? '' : 's'} modificado${files.length === 1 ? '' : 's'} em ${s.churnReport?.threshold ?? 3}+ rodadas de re-implement sem convergir.`, body: 'O watcher parou antes de mais uma rodada e postou o relatório no ticket. Isso costuma indicar conflito entre a spec e o código existente: esclareça a spec ou ajuste o plano. Para seguir com mais rodadas assim mesmo, responda no Redmine com um comentário começando por “aceito”. Os arquivos estão em “Arquivos com Churn”, abaixo.' };
  }
  switch (r.status) {
    case 'running':
      if (NodeClock.clock(s)?.level === 'over') return { icon: 'alert', title: `Sem sinal do agente em ${node}.`, body: 'O passo passou do timeout sem terminar. Veja o aviso INTERRUPTED abaixo.' };
      if (s.status === 'running') return { icon: 'info', title: `Em execução: ${node}.`, body: 'Um agente está rodando este passo agora (o contador na etapa mostra há quanto tempo). Mensagens enviadas agora entram no próximo passo.' };
      return { icon: 'info', title: `Próximo passo: ${node}.`, body: 'O watcher despacha este passo no próximo ciclo. Mensagens enviadas agora entram junto.' };
    case 'needs_human_review':
      return { icon: 'alert', title: r.node === 'escalated' ? 'O agente escalou este run e parou. Ele precisa de uma resposta sua.' : `Parado em ${node}. O agente precisa de uma resposta sua.`, body: 'Leia a última nota abaixo e responda na conversa. O run volta a andar quando o status sair de bloqueado.', note };
    case 'awaiting_approval':
      if (s.status === 'spec-change-pending-approval') return { icon: 'alert', title: `O /implement encontrou uma mudança de requisito (SPEC_CHANGE ${s.spec_change_pending?.id || ''}) e parou.`, body: `Uma decisão da implementação muda o que a spec pede, e o agente não pode aprovar isso sozinho. Leia o antes e o depois abaixo. Aprove (a spec ganha a entrada no Histórico de Mudanças e o run volta para o Plano) ou rejeite (a spec não muda e o run fica parado), aqui ou respondendo no Redmine.` };
      return { icon: 'alert', title: 'A spec estava incompleta: o watcher gerou um draft das seções que faltam e espera aprovação.', body: `O draft (gerado por IA) foi postado como comentário no ticket. Revise e aprove com um comentário começando por “${s.spec_pending_approval?.keyword || 'aprovado'}” no Redmine, ou pelo botão Aprovado abaixo. O watcher junta o draft na spec no próximo ciclo e o run volta a andar.` };
    case 'failed':
      return { icon: 'alert', title: 'A spec do ticket foi recusada pelo portão de qualidade.', body: 'Complete as seções que faltam na spec (ou na descrição do ticket). O watcher revalida sozinho no próximo ciclo.' };
    case 'committed':
      return { icon: 'info', title: 'Concluído e commitado.', body: 'Todas as etapas do ciclo passaram. Não há mais passos para o agente.' };
    case 'pending':
      return { icon: 'info', title: 'Planejado, ainda sem execução.', body: `Status gravado: “${s.status || '—'}”. O watcher não despacha este run até ele entrar em andamento.` };
    default:
      return { icon: 'alert', title: 'Não foi possível ler o state.json deste run.', body: 'O arquivo não existe ou tem JSON inválido.' };
  }
}

function renderDetail() {
  if (window.Compare?.active()) { $('detail').innerHTML = Compare.html(); return; }
  const r = runs.get(selected);
  if (!r && window.UX) { $('detail').innerHTML = UX.overview(); return; }
  if (!r) {
    const waiting = [...runs.values()].filter(x => !isHidden(x) && needsYou(x)).length;
    $('detail').innerHTML = `
      <div class="welcome">
        <svg width="120" height="28" viewBox="0 0 120 28" fill="none" aria-hidden="true"><path d="M8 14h104" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><circle cx="10" cy="14" r="8" fill="var(--clear)"/><circle cx="60" cy="14" r="9" fill="var(--surface)" stroke="var(--signal)" stroke-width="5"/><circle cx="110" cy="14" r="8" fill="var(--surface)" stroke="var(--idle)" stroke-width="4"/></svg>
        <h2>Escolha um run para acompanhar</h2>

  const s = r.state || {};
  const ex = explanation(r);
  const retries = s.retries || {};
  const committedLocked = r.status === 'committed' || r.pretask;
  const highRisk = isHighRisk(r);
  const stations = NODES.map(([key, label]) => {
    const st = stationState(r, key);

    const inner = st.done ? ICON.check : st.cls.includes('running') ? '◐' : st.cls.includes('failed') ? '✕' : st.cls.includes('current') ? '‖' : '';

        ${key === 'implement' ? preBuildGateHtml(r) : ''}
        <div class="stop" aria-hidden="true">${inner}</div>
        <div class="name">${label}<span class="sr-only"> — ${st.done ? 'concluída' : st.cls.includes('running') ? 'em execução' : st.cls.includes('failed') ? 'falhou' : st.cls.includes('current') ? 'parada aqui' : 'pendente'}</span></div>
        ${clk ? `<div class="elapsed" data-node-clock data-started="${clk.startedAt}" data-timeout="${clk.timeoutMs}" title="Tempo desde node_started_at · timeout ${esc(NodeClock.fmtDuration(clk.timeoutMs))}">${esc(NodeClock.fmtDuration(clk.elapsedMs))}</div>` : ''}
        ${retries[key] ? `<div class="retry">${retries[key]}ª tentativa extra</div>` : ''}
        ${key === 'plan' && planAttempt(s) > 1 ? `<div class="retry">Tentativa ${planAttempt(s)}</div>` : ''}
      </div>`;
  }).join('');

  $('detail').innerHTML = `
    <div class="stale-banner" id="staleBanner" role="status" aria-live="polite" hidden><span>${esc(StateVersion.MESSAGE)}</span><button type="button" class="ghost-btn" id="staleReload">Atualizar</button></div>
    <nav class="crumbs" aria-label="Navegação"><button type="button" class="back-link" id="backOverview">← Visão geral</button><span aria-hidden="true">›</span><span class="crumb-id">${esc(t.num || r.taskId)}</span></nav>
    <section class="hero" aria-labelledby="runTitle">

// ---------------------------------------------------------------- Redmine / PR folds
function ticketIdOfRun(r) {
  const fromTaskId = /^\d{4}-\d{2}-\d{2}-/.test(r.taskId) ? null : (r.taskId.match(/^(\d{4,6})-/) || [])[1];
  const id = r.state?.ticket_id ?? r.ticket?.id ?? fromTaskId;
  return /^\d+$/.test(String(id ?? '')) ? Number(id) : null;
}

// ---------------------------------------------------------------- Subtarefas (signals + would_route)
// Plataforma → consumidores: o detalhe do run mostra os grupos do plano e a faixa
// sombra. Não aplica S4. Implementação em public/run-subtasks.js.
function subtasksFoldHtml(r) {
  const c = costOf(r);
  if (!c || !window.RunSubtasks) return '';
  return window.RunSubtasks.foldHtml(c, {
    taskId: r.taskId,
    open: openFolds.has(`${r.taskId}:subtasks`),
    nodeLabels: NODE_LABEL,
  });
}
function wireSubtasksFold(r) {
  const el = $('foldSubtasks');
  if (!el) return;
  el.addEventListener('toggle', () => {
    if (el.open) openFolds.add(`${r.taskId}:subtasks`);
    else openFolds.delete(`${r.taskId}:subtasks`);
  });
}

// ---------------------------------------------------------------- Custo (cost_tracking)
// Escrito só pelo watcher (scripts/readmine-watcher.js). Token null = agente não
// reportou (≠ 0): mostrado como "—", nunca somado como zero.
function costOf(r) {
  const c = r?.state?.cost_tracking;
  return c && c.nodes && c.totals ? c : null;
}
function fmtTok(n) {
  if (n == null) return '—';
  if (n < 1000) return String(n);
  if (n < 1e6) return `${(n / 1000).toFixed(n < 1e4 ? 1 : 0).replace('.', ',')} mil`;
  return `${(n / 1e6).toFixed(n < 1e7 ? 2 : 1).replace('.', ',')} mi`;
}
function fmtMs(ms) {
  if (!(ms >= 0)) return '—';
  const sec = Math.round(ms / 1000);
  if (sec < 60) return `${sec} s`;
  const m = Math.floor(sec / 60), rs = sec % 60;
  if (m < 60) return rs ? `${m} min ${rs} s` : `${m} min`;
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? `${h} h ${rm} min` : `${h} h`;
}

// US$ vem do watcher (preço de API por modelo); R$ é conversão na exibição com a
// cotação de /api/fx (PTAX do Banco Central, ou USD_BRL fixo no .env).
let fx = null; // { rate, source, date, stale?, error? }
function fmtUsd(v) {
  if (v == null) return '—';
  const d = v >= 100 ? 0 : v >= 1 ? 2 : v >= 0.01 ? 3 : 4;
  return `US$ ${v.toLocaleString('pt-BR', { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d })}`;
}
function fmtBrl(usd) {
  if (usd == null || !(fx?.rate > 0)) return '';
  const v = usd * fx.rate;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: v >= 0.01 ? 2 : 4 });
}
const fxNote = () => fx?.rate > 0
  ? `R$ pela cotação ${fx.rate.toLocaleString('pt-BR', { maximumFractionDigits: 4 })} (${fx.source}${fx.date ? `, ${fx.date.split('-').reverse().join('/')}` : ''}${fx.stale ? ', última obtida' : ''}).`
  : (fx?.error ? `Sem conversão pra R$: ${fx.error}.` : '');
function costFoldRefresh() {
  const wrap = document.getElementById('foldCost')?.closest('.folds');
  const r = selected && runs.get(selected);
  if (!wrap || !r) return;
  wrap.outerHTML = costFoldHtml(r);
  wireCostFold(r);
}
function wireCostFold(r) {
  const fc = $('foldCost');
  if (fc) fc.addEventListener('toggle', () => { fc.open ? openFolds.add(`${r.taskId}:cost`) : openFolds.delete(`${r.taskId}:cost`); });
}
async function loadFx() {
  try { fx = await (await fetch('/api/fx')).json(); } catch { fx = { rate: null, error: 'dashboard sem resposta' }; }
  costFoldRefresh();
  window.Views?.refresh();
}
loadFx();
setInterval(loadFx, 6 * 60 * 60 * 1000);

function costFoldHtml(r) {
  const c = costOf(r);
  if (!c) return '';
  const open = openFolds.has(`${r.taskId}:cost`);
  const tt = c.totals;
  const costMoney = window.CostAttempts.money;
  const costTokens = window.CostAttempts.tokens;
  const tokSum = tt.input_tokens == null && tt.output_tokens == null ? null : (tt.input_tokens || 0) + (tt.output_tokens || 0);
  const rows = NODES.filter(([k]) => c.nodes[k]).map(([k, label]) => {
    const n = c.nodes[k];
    const also = (n.also_covers || []).map(x => NODE_LABEL[x] || x);
    const partial = n.runs_without_tokens > 0 && n.input_tokens != null;
    const costPartial = n.runs_without_cost > 0 && n.cost_usd != null;
    const models = (n.models || []).join(', ');
    return `<tr>
      <td>${esc(label)}${also.length ? ` <small>(inclui ${esc(also.join(', '))})</small>` : ''}</td>
      <td>${esc(n.agent || '—')}</td>
      <td class="n">${n.runs ?? 1}${n.retries ? ` <small>(${n.retries} retry)</small>` : ''}</td>
      <td class="n">${esc(fmtMs(n.duration_ms))}</td>
      <td class="n" title="${n.cache_read_input_tokens != null ? esc(`cache lido: ${costTokens(n.cache_read_input_tokens)} · cache gravado: ${costTokens(n.cache_creation_input_tokens)}`) : ''}">${esc(costTokens(n.input_tokens))}${partial ? ' <small title="Algum run deste nó não reportou tokens — soma parcial">*</small>' : ''}</td>
      <td class="n">${esc(costTokens(n.output_tokens))}</td>
      <td class="n" title="${esc(models ? `Modelos: ${models}` : '')}">${esc(costMoney(n.cost_usd ?? null))}${costPartial ? ' <small title="Algum run deste nó ficou sem custo calculável — soma parcial">*</small>' : ''}${n.cost_usd != null && fx?.rate ? `<br><small>${esc(fmtBrl(n.cost_usd))}</small>` : ''}</td>
    </tr>`;
  }).join('');
  const anyPartial = Object.values(c.nodes).some(n => n.runs_without_tokens > 0 || n.runs_without_cost > 0);
  const usd = tt.cost_usd ?? null;
  const moneySum = ` · ${costMoney(usd)}${usd != null && fx?.rate ? ` (${fmtBrl(usd)})` : ''}`;
  return `<div class="folds"><details class="fold" id="foldCost" ${open ? 'open' : ''}>
    <summary>${ICON.chev} Custo <span class="sum-right">${esc(fmtMs(tt.duration_ms))} · ${esc(costTokens(tokSum))} tokens${esc(moneySum)}${tt.loop_count ? ` · ${tt.loop_count} reexecuç${tt.loop_count > 1 ? 'ões' : 'ão'}` : ''}</span></summary>
    <div class="fold-body">
      <div class="cost-wrap"><table class="cost-table">
        <thead><tr><th>Etapa</th><th>Agente</th><th class="n">Execuções</th><th class="n">Tempo</th><th class="n">Tokens entrada</th><th class="n">Tokens saída</th><th class="n">Custo</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total</td><td></td><td class="n">${tt.loop_count ? `<small>${tt.loop_count} reexec.</small>` : ''}</td><td class="n">${esc(fmtMs(tt.duration_ms))}</td><td class="n">${esc(costTokens(tt.input_tokens))}</td><td class="n">${esc(costTokens(tt.output_tokens))}</td><td class="n">${esc(costMoney(usd))}${usd != null && fx?.rate ? `<br><small>${esc(fmtBrl(usd))}</small>` : ''}</td></tr></tfoot>
      </table></div>
      <p class="cost-note">Medido pelo watcher a cada despacho. Tokens de entrada incluem cache (passe o mouse para ver a quebra). Contadores ausentes = “não observado”; custo ausente = “sem preço”.${anyPartial ? ' * = soma parcial.' : ''}</p>
      <p class="cost-note">Custo estimado pelo preço de API de cada modelo. Em assinatura (Pro/Max) é o equivalente, não o valor cobrado. Codex e modelos fora da tabela ficam sem custo. ${esc(fxNote())}</p>
      <details class="cost-source"><summary>Fonte de preços do agregado</summary><p class="cost-note">${esc(c.pricing_source || 'UNKNOWN')}</p></details>
      ${window.CostAttempts.render(c, NODE_LABEL)}
    </div>
  </details></div>`;
}

// ---------------------------------------------------------------- Recusas QA
// Cada recusa separada do ciclo principal (server.js > summarize: qaCycles, montado por
// scripts/lib/qa-cycles.js). Abre sozinho enquanto há retry rodando ou recusa sem retry.
const QA_SITUATION = { committed: 'Entregue', running: 'Em andamento', superseded: 'Recusada de novo', blocked: 'Bloqueado', escalated: 'Escalado' };
// Selo do ciclo: entregue e depois recusado mostra as duas coisas, na ordem.
function qaSituationHtml(situation, rejectedAgain) {
  if (situation === 'committed' && rejectedAgain) return '<span class="sit committed">Entregue</span><span class="sit-arrow" aria-hidden="true">→</span><span class="sit rejected">Recusada pelo QA</span>';
  const key = situation === 'running' ? 'running' : situation === 'committed' ? 'committed' : situation === 'superseded' ? 'rejected' : ['blocked', 'escalated', 'needs_human_review'].includes(situation) ? 'blocked' : '';
  return `<span class="sit ${key}">${esc(QA_SITUATION[situation] || STATUS[situation] || situation)}</span>`;
}
const qaDay = iso => { const t = Date.parse(iso); return Number.isFinite(t) ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; };
const qaNoteText = n => String(n || '').replace(/<img[^>]*>/gi, '[imagem]').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/\r\n/g, '\n').trim();
function qaSpan(from, to) {
  const a = Date.parse(from), b = Date.parse(to);
  return Number.isFinite(a) && Number.isFinite(b) && b >= a ? fmtMs(b - a) : null;
}
function qaMoney(usd) { return usd == null ? '—' : `${fmtUsd(usd)}${fx?.rate ? ` (${fmtBrl(usd)})` : ''}`; }
function qaFoldHtml(r) {
  const q = r.qaCycles;
  if (!q || (!q.cycles.length && !q.pending)) return '';
  const live = q.pending || q.cycles.some(c => c.situation === 'running');
  const open = openFolds.has(`${r.taskId}:qa`) || (live && !openFolds.has(`${r.taskId}:qa-closed`));
  const tid = ticketIdOfRun(r);
  const m = q.main;
  const mainHtml = `<div class="qa-cycle main">
    <div class="qa-cycle-head"><strong>Ciclo principal</strong>${m.committed ? qaSituationHtml('committed', true) : '<span class="sit rejected">Recusada pelo QA</span>'}</div>
    <div class="qa-cycle-meta">
      ${m.started_at ? `<span>Início <b>${esc(when(m.started_at))}</b></span>` : ''}
      ${m.ended_at ? `<span>Último passo <b>${esc(when(m.ended_at))}</b></span>` : ''}
      ${qaSpan(m.started_at, m.ended_at) ? `<span>Duração <b>${esc(qaSpan(m.started_at, m.ended_at))}</b></span>` : ''}
      <span>Passos <b>${m.steps}</b></span>
      <span>Custo <b>${esc(qaMoney(m.cost_usd))}</b></span>
    </div></div>`;
  const cyclesHtml = q.cycles.map(c => {
    const end = c.ended_at || (c.situation === 'running' ? new Date().toISOString() : c.last_step_at);
    const dur = qaSpan(c.started_at, end);
    const note = qaNoteText(c.note);
    const steps = c.steps.map(s => `<li><span class="when">${esc(when(s.at))}</span><span class="txt"><b>${esc(s.nodes.map(n => NODE_LABEL[n] || n).join(' + ') || 'passo')}</b> <small>${esc(s.agent || '')}${s.fallback ? ' · fallback' : ''}</small>${s.note ? ` — ${esc(s.note.length > 220 ? `${s.note.slice(0, 220)}…` : s.note)}` : ''}</span></li>`).join('');
    const prs = c.prs.map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.repo || 'PR')} #${esc(p.id ?? '')}</a> <small>${esc(p.status || '')}</small>`).join(' ');
    return `<div class="qa-cycle rej">
      <div class="qa-cycle-head"><strong>Recusa #${c.n}${c.rejected_at ? ` <small>de ${esc(qaDay(c.rejected_at))}</small>` : ''}</strong>${qaSituationHtml(c.situation, c.rejected_again)}${c.situation === 'running' && c.node ? `<small>agora em ${esc(NODE_LABEL[c.node] || c.node)}</small>` : ''}</div>
      <div class="qa-cycle-meta">
        ${c.rejected_at ? `<span>Recusada <b>${esc(when(c.rejected_at))}</b></span>` : ''}
        <span>Retry iniciado <b>${esc(when(c.started_at))}</b></span>
        ${c.ended_at ? `<span>Concluído <b>${esc(when(c.ended_at))}</b></span>` : ''}
        ${dur ? `<span>Duração <b>${esc(dur)}</b></span>` : ''}
        <span>Passos <b>${c.steps.length}</b></span>
        <span title="${c.cost_usd == null ? 'Custo por recusa só é medido nos retries pedidos depois desta versão do dashboard (cost_tracking é cumulativo)' : ''}">Custo <b>${esc(qaMoney(c.cost_usd))}</b>${c.tokens != null ? ` · ${esc(fmtTok(c.tokens))} tokens` : ''}</span>
        ${c.journal_id && tid ? `<span>Journal <b>#${esc(c.journal_id)}</b></span>` : ''}
      </div>
      ${note ? `<div class="qa-note">${esc(note)}</div>` : `<p class="cost-note">${c.reconstructed && !c.rejected_at ? 'Recusa reconstruída do log do agente: nota e data do QA não ficaram registradas neste run.' : 'Nota do QA não registrada neste run.'}</p>`}
      ${steps ? `<ul class="qa-steps">${steps}</ul>` : '<p class="cost-note">Nenhum passo do agente registrado ainda neste retry.</p>'}
      ${prs ? `<div class="qa-prs">PRs deste retry: ${prs}</div>` : ''}
    </div>`;
  }).join('');
  const p = q.pending;
  const st = qaRetry.get(r.taskId) || {};
  const blockedInfo = qaRetryBlockedInfo(r);
  const busy = st.busy || (r.qaRetryPending && !blockedInfo);
  const sitLabel = blockedInfo
    ? `Retry bloqueado — ${QA_RETRY_BLOCKED_LABEL[blockedInfo.reason] || blockedInfo.reason}`
    : (busy ? 'Retry solicitado — aguardando o watcher' : 'Aguardando correção');
  const pendingHtml = p ? `<div class="qa-cycle pending">
    <div class="qa-cycle-head"><strong>Recusa #${q.cycles.length + 1}${p.rejected_at ? ` <small>de ${esc(qaDay(p.rejected_at))}</small>` : ''}</strong><span class="sit blocked">${esc(sitLabel)}</span></div>

function wireQaFold(r) {

// ---------------------------------------------------------------- Score do plano

function preBuildGateHtml(r) {

// "✨ Corrigir com IA" (POST /api/runs/:taskId/pre-build/ai-fix): passos do agente chegam

async function loadAiFixEvents(taskId) {

// state.churnReport (watcher, runChurnGate): gravado na detecção e mantido depois do aceite.

        <ul class="churn-files">${rows}</ul>
        ${isChurn(r) && !s.churnAccepted ? `<p class="fold-msg">Para ver o que cada rodada mudou, no worktree do ticket:
          <code>git log -p refs/churn/${esc(r.taskId)}/start..refs/churn/${esc(r.taskId)}/rounds -- &lt;arquivo&gt;</code>.

function planAttempt(s) {

}
function planScoreHtml(r) {

  const feedback = Array.isArray(s.planFeedback) ? s.planFeedback : [];

    <details class="fold" id="foldPlan" ${open ? 'open' : ''}>
      <summary>${ICON.chev} Qualidade do plano

          <span class="plan-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${score}" aria-label="Score do plano: ${score} de 100, mínimo ${esc(String(min))}"><i class="${band}" style="width:${score}%"></i><b style="left:calc(${Math.max(0, Math.min(100, min))}% - 1px)" title="Mínimo: ${esc(String(min))}"></b></span>
          <span class="plan-score">${score}<small>/100 · ${esc(verdict)}</small></span>

      </summary>
      <div class="fold-body">

}

// ---------------------------------------------------------------- Migration Checklist
// Bloco inteiro vem de /api/runs/:id/schema-checklist (o painel de contexto só tem o
// fim do context.md). Checks no localStorage por task-id (SchemaChecklist.storageKey),
// invalidados quando o watcher regenera a checklist (signature nova).
const schemaCache = new Map(); // taskId -> { markdown, signature } | { error }
function schemaChecks(taskId) {

}
function schemaBodyHtml(taskId) {
  const c = schemaCache.get(taskId);

  if (c.error) return `<p class="fold-msg err">Não deu para carregar a checklist: ${esc(c.error)}</p>`;
  if (!c.markdown) return '<p class="fold-msg">O state.json marca mudança de schema, mas o bloco da checklist não está no context.md (o agente pode ter reescrito o arquivo). O watcher repõe no próximo despacho.</p>';

  const pr = SchemaChecklist.progress(checks);
  return `<div class="mig-actions">
      <button class="copy-chip" type="button" id="migCopy" title="Copiar o markdown da checklist (com os itens marcados) para colar no PR ou no Redmine">${ICON.copy} Copiar checklist</button>
      <span class="fold-msg" id="migProgress">${pr.done}/${pr.total} itens marcados · salvo só neste navegador</span>
    </div>
    <div class="mig-body">${SchemaChecklist.render(c.markdown, checks)}</div>`;
}
function schemaFoldHtml(r) {
  const lvl = schemaRisk(r);
  if (!lvl || r.pretask) return '';
  const open = openFolds.has(`${r.taskId}:schema`) || (lvl === 'high' && !openFolds.has(`${r.taskId}:schema-closed`));
  const pr = SchemaChecklist.progress(schemaChecks(r.taskId));
  return `<div class="folds">
    <details class="fold" id="foldSchema" ${open ? 'open' : ''}>
      <summary>${ICON.chev} Migration Checklist
        <span class="sum-right">
          <span class="schema-badge ${lvl}">⚠ SCHEMA · ${esc(lvl)}</span>
          ${pr.total ? `<span id="migSum">${pr.done}/${pr.total}</span>` : ''}
        </span>
      </summary>
      <div class="fold-body" id="migWrap">${schemaBodyHtml(r.taskId)}</div>
    </details>
  </div>`;
}
async function loadSchemaChecklist(taskId, { force = false } = {}) {
  if (!force && schemaCache.has(taskId)) return;
  try {
    const d = await api(`/api/runs/${encodeURIComponent(taskId)}/schema-checklist`);
    schemaCache.set(taskId, { markdown: d.markdown || null, signature: d.signature || null });
  } catch (e) {
    schemaCache.set(taskId, { error: e.message || 'dashboard sem resposta' });
  }
  if (taskId === selected && $('migWrap')) { $('migWrap').innerHTML = schemaBodyHtml(taskId); wireSchemaBody(taskId); }
}
function wireSchemaBody(taskId) {
  const wrap = $('migWrap');
  if (!wrap) return;
  wrap.querySelectorAll('input[data-mig-index]').forEach(cb => cb.addEventListener('change', () => {
    const c = schemaCache.get(taskId);
    if (!c?.markdown) return;
    const key = SchemaChecklist.storageKey(taskId);
    const saved = load(key, null);
    const checked = saved && saved.sig === (c.signature || null) && saved.checked ? { ...saved.checked } : {};
    checked[cb.dataset.migIndex] = cb.checked;
    save(key, { sig: c.signature || null, checked });
    cb.closest('li')?.classList.toggle('done', cb.checked);
    const pr = SchemaChecklist.progress(schemaChecks(taskId));
    if ($('migProgress')) $('migProgress').textContent = `${pr.done}/${pr.total} itens marcados · salvo só neste navegador`;
    if ($('migSum')) $('migSum').textContent = `${pr.done}/${pr.total}`;
  }));
  const copy = $('migCopy');
  if (copy) copy.addEventListener('click', async () => {
    const c = schemaCache.get(taskId);
    if (!c?.markdown) return;
    const text = `## ⚠️ Schema Migration Checklist\n\n${SchemaChecklist.toMarkdown(c.markdown.replace(/^##\s+.*\n+/, ''), schemaChecks(taskId))}\n`;
    try { await navigator.clipboard.writeText(text); toast('Checklist copiada. Cole no PR ou no Redmine.'); }
    catch { toast('Não deu para copiar: o navegador bloqueou a área de transferência.'); }
  });
}
function wireSchemaFold(r) {
  const fs = $('foldSchema');
  if (!fs) return;
  fs.addEventListener('toggle', () => {
    // Risco high abre sozinho; :schema-closed lembra que o usuário fechou.
    if (fs.open) { openFolds.add(`${r.taskId}:schema`); openFolds.delete(`${r.taskId}:schema-closed`); }
    else { openFolds.delete(`${r.taskId}:schema`); openFolds.add(`${r.taskId}:schema-closed`); }
  });
  wireSchemaBody(r.taskId);
  loadSchemaChecklist(r.taskId);
}

        ${ro || children.length ? `<dl class="replay-facts">
          ${ro ? `<dt>Run original</dt><dd>${runLink(ro.originalRun)}</dd>
          <dt>Retomado a partir de</dt><dd>${esc(label(ro.fromNode))}</dd>
          <dt>Quando</dt><dd>${esc(when(ro.replayedAt))}</dd>` : ''}
          ${children.length ? `<dt>Retomado como</dt><dd>${children.map(runLink).join(', ')}</dd>` : ''}
        </dl>` : ''}
        ${can ? `<form class="replay-actions" id="replayForm"${ro || children.length ? ' style="margin-top:12px"' : ''}>
          <label for="replayFrom">↩ Retomar a partir de</label>
          <select id="replayFrom">${NODES.filter(([k]) => k !== 'fetch_ticket').map(([k, l]) =>
            `<option value="${esc(k)}" ${allowed.has(k) ? '' : 'disabled'}>${esc(l)}</option>`).join('')}</select>
          <button type="submit" class="retry-btn" id="replayGo">Retomar</button>
          <span class="hint" id="replayMsg">Cria um run novo no mesmo worktree e re-executa só do nó escolhido em diante. Este run não é alterado.</span>
        </form>` : ''}
      </div>
    </details>
  </div>`;
}
function wireReplay(r) {
  document.querySelectorAll('#detail [data-replay-open]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.replayOpen;
    if (runs.has(id)) select(id); else toast(`O run ${id} não está na lista (arquivado?).`);
  }));
  const fold = $('foldReplay');
  if (fold) fold.addEventListener('toggle', () => { if (fold.open) openFolds.add(`${r.taskId}:replay`); else openFolds.delete(`${r.taskId}:replay`); });
  const form = $('replayForm');
  if (!form) return;
  const sel = $('replayFrom');
  const allowed = r.replay?.nodes || [];
  // Padrão: o nó onde o ciclo parou (se der pra retomar dele), senão o último permitido.
  sel.value = allowed.includes(r.node) ? r.node : allowed[allowed.length - 1];
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fromNode = sel.value;
    const btn = $('replayGo'), msg = $('replayMsg');
    if (!confirm(`Retomar ${r.taskId} a partir de "${sel.selectedOptions[0].textContent}"?\n\nUm run novo vai re-executar este nó e os seguintes no mesmo worktree.`)) return;
    btn.disabled = true; btn.textContent = 'Retomando…';
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(r.taskId)}/replay`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: casBody(r.taskId, { fromNode }),
      });
      const body = await res.json().catch(() => ({}));
      if (StateVersion.isConflict(res.status, body)) markStale(r.taskId);
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      toast(`Replay ${body.replayTaskId} criado${body.dispatched ? ' e despachado' : ''}.${body.warnings?.length ? ` Aviso: ${body.warnings[0]}` : ''}`,
        { label: 'Abrir', run: () => { if (runs.has(body.replayTaskId)) select(body.replayTaskId); } });
      btn.disabled = false; btn.textContent = 'Retomar';
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Retomar';
      msg.textContent = `Não deu para retomar: ${err.message}`;
      msg.classList.add('err');
    }
  });
}

function wireFolds(r) {
  wireReplay(r);
  wireCostFold(r);
  wireSubtasksFold(r);
  wireQaFold(r);
  wireSchemaFold(r);
  const fb = $('foldPreBuild');
  if (r.preBuild?.aiFix && !aiFixEvents.has(r.taskId)) { aiFixEvents.set(r.taskId, null); loadAiFixEvents(r.taskId); }
  { const ol = $('aiFixSteps'); if (ol) ol.scrollTop = ol.scrollHeight; }
  const ab = $('preBuildAiFix');
  if (ab) ab.addEventListener('click', async () => {
    ab.disabled = true; ab.textContent = 'Despachando…';
    const hint = ab.parentElement.querySelector('.hint');
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(r.taskId)}/pre-build/ai-fix`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        ab.disabled = false; ab.textContent = '✨ Corrigir com IA';
        hint.textContent = `Não deu para despachar a IA: ${body.error || `HTTP ${res.status}`}`;
        return;
      }
      // Os primeiros passos podem ter saído pelo WebSocket antes do 202: o GET traz tudo, o WS segue daí.
      openFolds.add(`${r.taskId}:prebuild`);
      aiFixEvents.set(r.taskId, null);
      loadAiFixEvents(r.taskId);
    } catch (e) {
      ab.disabled = false; ab.textContent = '✨ Corrigir com IA';
      hint.textContent = `Não deu para despachar a IA: ${e.message}`;
    }
  });
  const cb = $('aiFixCancel');
  if (cb) cb.addEventListener('click', async () => {
    cb.disabled = true; cb.textContent = 'Parando…';
    try { await fetch(`/api/runs/${encodeURIComponent(r.taskId)}/pre-build/ai-fix/cancel`, { method: 'POST' }); }
    catch { cb.disabled = false; cb.textContent = '■ Parar'; }
  });
  const ca = $('churnAccept');
  if (ca) ca.addEventListener('click', async () => {
    ca.disabled = true; ca.textContent = 'Aceitando…';
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(r.taskId)}/churn/accept`, { method: 'POST' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        ca.disabled = false; ca.textContent = '✓ Aceitar churn';
        ca.nextElementSibling.textContent = `Não deu para aceitar: ${body.error || `HTTP ${res.status}`}`;
      }
      // Sucesso: o state_update do WebSocket re-renderiza o painel já como "aceito".
    } catch (e) {
      ca.disabled = false; ca.textContent = '✓ Aceitar churn';
      ca.nextElementSibling.textContent = `Não deu para aceitar: ${e.message}`;
    }
  });
  const rb = $('preBuildRetry');
  if (rb) rb.addEventListener('click', async () => {
    rb.disabled = true; rb.textContent = 'Recompilando…';
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(r.taskId)}/pre-build/retry`, { method: 'POST' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        rb.disabled = false; rb.textContent = '↻ Tentar de novo';
        rb.nextElementSibling.textContent = `Não deu para recompilar: ${body.error || `HTTP ${res.status}`}`;
      }
      // Sucesso: o resultado chega pelo WebSocket (state_update) e re-renderiza o painel.
    } catch (e) {
      rb.disabled = false; rb.textContent = '↻ Tentar de novo';
      rb.nextElementSibling.textContent = `Não deu para recompilar: ${e.message}`;
    }
  });
  if (fb) fb.addEventListener('toggle', () => {
    // Com o ciclo parado no portão o fold abre sozinho; :prebuild-closed lembra que o usuário fechou.
    if (fb.open) { openFolds.add(`${r.taskId}:prebuild`); openFolds.delete(`${r.taskId}:prebuild-closed`); }
    else { openFolds.delete(`${r.taskId}:prebuild`); openFolds.add(`${r.taskId}:prebuild-closed`); }
  });
  const fp = $('foldPlan');
  if (fp) fp.addEventListener('toggle', () => {
    // Em plan-escalation o fold abre sozinho; :plan-closed lembra que o usuário fechou.
    if (fp.open) { openFolds.add(`${r.taskId}:plan`); openFolds.delete(`${r.taskId}:plan-closed`); }
    else { openFolds.delete(`${r.taskId}:plan`); openFolds.add(`${r.taskId}:plan-closed`); }
  });
  const fc = $('foldChurn');
  if (fc) fc.addEventListener('toggle', () => {
    // Em churn-escalation o fold abre sozinho; :churn-closed lembra que o usuário fechou.
    if (fc.open) { openFolds.add(`${r.taskId}:churn`); openFolds.delete(`${r.taskId}:churn-closed`); }
    else { openFolds.delete(`${r.taskId}:churn`); openFolds.add(`${r.taskId}:churn-closed`); }
  });
  const ft = $('foldTicket');
  if (ft) {
    ft.addEventListener('toggle', () => {
      ft.open ? openFolds.add(`${r.taskId}:ticket`) : openFolds.delete(`${r.taskId}:ticket`);
      if (ft.open) loadTicket(r.taskId);
    });
    renderTicket(r.taskId);
    if (ft.open) loadTicket(r.taskId);
  }
  if ($('prBody')) {
    renderPr(r.taskId);
    loadPr(r.taskId);
  }
}

async function apiStatus(path) {
  const res = await fetch(path);
  const body = await res.json().catch(() => ({}));
  return { status: res.status, ok: res.ok, body };
}

async function loadTicket(taskId) {
  if (ticketCache.has(taskId)) return renderTicket(taskId);
  ticketCache.set(taskId, { loading: true });
  renderTicket(taskId);
  try {
    const r = await apiStatus(`/api/runs/${encodeURIComponent(taskId)}/ticket`);
    ticketCache.set(taskId, r.ok ? { data: r.body } : { code: r.status, error: r.body.error });
  } catch (e) {
    ticketCache.set(taskId, { code: 0, error: e.message });
  }
  // Erro não fica em cache: expandir de novo tenta outra vez.
  const c = ticketCache.get(taskId);
  renderTicket(taskId);
  if (!c.data) ticketCache.delete(taskId);
}

function renderTicket(taskId) {
  const body = $('ticketBody');
  if (!body || taskId !== selected) return;
  const c = ticketCache.get(taskId);
  if (!c) { body.innerHTML = '<p class="fold-msg">Expanda para buscar no Redmine.</p>'; return; }
  if (c.loading) { body.innerHTML = '<p class="fold-msg">Buscando no Redmine…</p>'; return; }
  if (!c.data) {
    body.innerHTML = c.code === 503
      ? '<p class="fold-msg warn">Redmine não configurado — defina REDMINE_URL e REDMINE_API_KEY.</p>'
      : '<p class="fold-msg err">Ticket não encontrado ou Redmine indisponível.</p>';
    return;
  }
  const t = c.data;
  if ($('ticketSum') && t.status) $('ticketSum').innerHTML = `#${esc(t.id)} · ${ticketStatusBadge(t.status)}`;
  const est = t.estimated_hours != null ? `${String(t.estimated_hours).replace('.', ',')} h` : 'sem estimativa';
  const done = t.done_ratio != null ? t.done_ratio : null;
  body.innerHTML = `
    <a class="tk-title" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">#${esc(t.id)} — ${esc(t.subject)}</a>
    <div class="tk-facts">
      <span>Status ${t.status ? ticketStatusBadge(t.status) : '<b>—</b>'}</span>
      <span>Responsável <b>${esc(t.assigned_to || 'ninguém')}</b></span>
      <span>Estimativa <b>${esc(est)}</b></span>
      <span>Concluído <b>${done != null ? `${done}%` : '—'}</b>${done != null ? `<span class="progress"><i style="width:${Math.max(0, Math.min(100, done))}%"></i></span>` : ''}</span>
      ${t.priority ? `<span>Prioridade <b>${esc(t.priority)}</b></span>` : ''}
      ${t.updated_on ? `<span>Atualizado <b>${esc(ago(t.updated_on))}</b></span>` : ''}
    </div>
    <a class="ext" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Abrir no Redmine ↗</a>`;
}

async function loadPr(taskId, force) {
  const c = prCache.get(taskId);
  if (c?.loading) return;
  // Erro também vale pelo TTL: a matrix busca a cada render do detalhe (o botão força).
  if (!force && c && Date.now() - c.at < PR_TTL_MS) return renderPr(taskId);
  prCache.set(taskId, { ...(c || {}), loading: true });
  renderPr(taskId);
  let next;
  try {
    const r = await apiStatus(`/api/runs/${encodeURIComponent(taskId)}/pr`);
    next = r.ok ? { data: r.body, at: Date.now() } : { code: r.status, error: r.body.error, at: Date.now() };
  } catch (e) {
    next = { code: 0, error: e.message, at: Date.now() };
  }
  // Falha no refresh não apaga o último resultado bom.
  if (!next.data && c?.data) next = { ...c, loading: false, refreshError: next };
  prCache.set(taskId, next);
  renderPr(taskId);
  renderSidebar(); // badges da lista ganham a cor do estado real
}

function renderPr(taskId) {
  const body = $('prBody');
  if (!body || taskId !== selected) return;
  const r = runs.get(taskId);
  const c = prCache.get(taskId);
  const rows = prRows(r);
  if ($('prAlert')) $('prAlert').innerHTML = prAlertHtml(rows);
  const merged = rows.filter(p => p.state === 'MERGED').length;
  $('prCount').textContent = `${rows.length} repo${rows.length > 1 ? 's' : ''} · ${merged} MERGED`;
  const stamp = c?.loading ? 'consultando o Bitbucket…' : c?.data?.fetched_at ? `Bitbucket consultado ${ago(c.data.fetched_at)}` : '';
  $('prTools').innerHTML = `<span class="fold-msg">${esc(stamp)}</span><button class="refresh" type="button" id="prRefresh" ${c?.loading ? 'disabled' : ''}>↻ Atualizar</button>`;

  // Sem resposta do Bitbucket, a matrix continua com o último status gravado pelo watcher.
  let note = '';
  if (c?.refreshError) note = '<p class="fold-msg err">A última atualização falhou; mostrando o resultado anterior.</p>';
  else if (c && !c.loading && !c.data) {
    note = c.code === 503
      ? '<p class="fold-msg warn">Bitbucket não configurado no dashboard (BITBUCKET_WORKSPACE / BITBUCKET_API_TOKEN) — mostrando o último status gravado pelo watcher.</p>'
      : c.code === 422
        ? '<p class="fold-msg err">Não deu para descobrir o número do PR a partir do state.json.</p>'
        : '<p class="fold-msg err">Bitbucket indisponível — mostrando o último status gravado pelo watcher.</p>';
  }

  const cols = '<div class="pr-row cols" aria-hidden="true"><span>Repo</span><span>Status</span><span>Última checagem</span><span></span></div>';
  const list = rows.map(p => {
    const label = `${p.repo || 'PR'}${p.id ? ` #${p.id}` : ''}`;
    const l = p.live;
    const checked = p.last_checked_at
      ? `<span title="${esc(when(p.last_checked_at))}">${esc(ago(p.last_checked_at))}</span>`
      : '<span title="O polling do watcher ainda não consultou este PR">ainda não checado</span>';
    let detail = '';
    if (p.error) detail = `<div class="detail err">${esc(p.error)}</div>`;
    else if (l) {
      const approvals = l.participants?.length ? `<span class="approved">Aprovado por ${esc(l.participants.join(', '))}</span>` : '<span>Nenhuma aprovação ainda</span>';
      detail = `<div class="detail">
        ${l.title ? `<span><b>${esc(l.title)}</b></span>` : ''}
        ${l.source && l.destination ? `<span><b>${esc(l.source)}</b> → <b>${esc(l.destination)}</b></span>` : ''}
        ${approvals}
      </div>`;
    }
    return `<div class="pr-row">
      <span class="repo">${esc(label)}</span>
      <span><span class="pr-badge ${p.state || 'unknown'}">${esc(p.state || 'desconhecido')}</span></span>
      <span class="checked">${checked}</span>
      ${p.url ? `<a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Abrir no Bitbucket ↗</a>` : '<span></span>'}
      ${detail}
    </div>`;
  }).join('');
  body.innerHTML = note + cols + list;
  $('prRefresh').addEventListener('click', () => loadPr(taskId, true));
}

function renderApproval(taskId) {

async function toggleDraft(taskId) {

  ui.open = true; ui.loading = true; ui.error = null;
  renderApproval(taskId);
  try {
    ui.draft = await api(`/api/runs/${encodeURIComponent(taskId)}/spec-draft`);
  } catch (e) { ui.error = `Não foi possível ler o draft: ${e.message}`; ui.open = false; }
  ui.loading = false;
  renderApproval(taskId);
}
async function decideSpecChange(taskId, action) {
  const ui = approvalUi.get(taskId) || {};
  approvalUi.set(taskId, ui);
  const id = runs.get(taskId)?.state?.spec_change_pending?.id || 'SPEC_CHANGE';
  const ok = confirm(action === 'reject'
    ? `Rejeitar a ${id}?\n\nA spec NÃO muda e o run fica parado até alguém decidir implementar o critério como está.`
    : `Aprovar a ${id}?\n\nIsso muda o requisito funcional: a spec ganha a entrada no Histórico de Mudanças, o spec_hash é recalculado e o run volta para o Plano (plano, handoff e evidências são refeitos).`);
  if (!ok) return;
  ui.sending = true; ui.msg = ''; renderApproval(taskId);
  try {
    const res = await api('/api/redmine/comment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: casBody(taskId, { taskId, action, operation_id: approvalOpId(ui, action) }) });
    delete ui.opIds[action];
    ui.msg = action === 'reject'
      ? `Rejeição postada no ticket #${res.ticketId}. O watcher registra no próximo tick.`
      : `Aprovação postada no ticket #${res.ticketId}. O watcher atualiza a spec e volta o run para o Plano no próximo tick.`;

// Mesmo operation_id em todas as tentativas da mesma decisão até dar certo: depois de um

}
async function approveDraft(taskId) {
  if (runs.get(taskId)?.state?.status === 'spec-change-pending-approval') return decideSpecChange(taskId, 'approve');
  const ui = approvalUi.get(taskId) || {};
  approvalUi.set(taskId, ui);
  const specDraft = runs.get(taskId)?.state?.status === 'spec-draft';
  const ok = confirm(specDraft
    ? 'A spec rascunho foi montada dos campos do ticket (e as seções marcadas, sugeridas por IA).\n\n'
      + 'Confirme que você leu a spec (no Redmine ou em “Ver spec”) e que ela está correta. '
      + 'Isso posta o comentário de aprovação no ticket, e o watcher troca para draft: false e libera o ciclo no próximo tick.'
    : 'O draft da spec foi GERADO POR IA e precisa de revisão humana.\n\n'
      + 'Confirme que você leu o draft (no Redmine ou em “Ver draft”) e que ele está correto. '
      + 'Isso posta o comentário de aprovação no ticket, e o watcher junta o draft na spec no próximo ciclo.');
  if (!ok) return;
  ui.sending = true; ui.msg = ''; renderApproval(taskId);
  try {
    const res = await api('/api/redmine/comment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: casBody(taskId, { taskId, operation_id: approvalOpId(ui, 'approve') }) });
    delete ui.opIds.approve;
    ui.msg = specDraft
      ? `Aprovação postada no ticket #${res.ticketId}. O watcher libera a spec (draft: false) no próximo tick.`
      : `Aprovação postada no ticket #${res.ticketId}. O watcher junta o draft na spec no próximo ciclo.`;
    ui.msgCls = 'ok';
  } catch (e) { ui.msg = `Falha ao aprovar: ${e.message}`; ui.msgCls = 'err'; }

function composerHint(r) {

// ---------------------------------------------------------------- conversation
let sentCache = null;
function sentHistory() { return (sentCache ??= load(HISTORY_KEY, [])); }
function invalidateSentCache() { sentCache = null; }
window.addEventListener('storage', e => { if (e.key === HISTORY_KEY || e.key === null) invalidateSentCache(); });

// human_inputs[].content pode juntar vários blocos "## Human input — <ISO>" de uma vez.
function parseHumanInputs(state) {
  const out = [];
  for (const hi of state?.human_inputs || []) {
    const blocks = String(hi.content || '').split(/^## Human input — /m).filter(b => b.trim());
    for (const b of blocks) {
      const m = b.match(/^(\S+)\s*\n+([\s\S]*)$/);
      const sentAt = m && Date.parse(m[1]) ? m[1] : hi.timestamp;
      const text = (m && Date.parse(m[1]) ? m[2] : b).trim();
      out.push({ text, sentAt, readAt: hi.timestamp });
    }
  }
  return out;
}

// Fallback pra runs sem state.human_inputs (antigos, ou o watcher não gravou): os
// blocos "## Human input — <ISO>" que o agente já trouxe pro context.md. Usa o
// contextText já carregado (pode ser só o fim do arquivo, conforme o modo do painel).
function humanInputsFromContext(text) {
  const out = [];
  const re = /^## Human input — (\S+)[^\n]*\n([\s\S]*?)(?=^#{1,2} |(?![\s\S]))/gm;
  for (const m of String(text || '').matchAll(re)) {
    const body = m[2].trim();
    if (body) out.push({ text: body, sentAt: Date.parse(m[1]) ? m[1] : null, readAt: null, fromContext: true });
  }
  return out;
}

function renderThread() {
  const r = runs.get(selected);
  const el = $('thread');
  if (!r || !el) return;
  const s = r.state || {};
  let read = parseHumanInputs(s);
  if (!read.length && contextFor === selected) read = humanInputsFromContext(contextText);
  const items = read.map(m => ({ kind: 'me', at: m.sentAt, text: m.text, readAt: m.readAt, fromContext: m.fromContext }));
  const readTexts = new Set(read.map(m => m.text.trim()));
  let queuedLocal = 0;
  for (const h of sentHistory().filter(h => h.taskId === selected)) {
    if (readTexts.has(h.message.trim())) continue;
    items.push({ kind: 'me', at: h.at, text: h.message, queued: true });
    queuedLocal++;
  }
  for (const a of s.agent_log || []) {
    if (!a.note) continue;
    const nodes = (a.nodes || []).map(n => NODE_LABEL[n] || n).join(' e ');
    items.push({ kind: 'agent', at: a.at, text: a.note, who: `Agente${nodes ? ` em ${nodes}` : ''}` });
  }
  items.sort((a, b) => (Date.parse(a.at) || 0) - (Date.parse(b.at) || 0));

  let html = items.slice(-60).map(it => {
    if (it.kind === 'agent') {
      const long = it.text.length > 600;
      return `<div class="msg agent"><span class="who">${esc(it.who)}</span><div class="bubble">${esc(it.text)}</div>
        <div class="foot"><span>${esc(when(it.at))}</span>${long ? '<button class="link-btn" type="button" data-expand>Ler tudo</button>' : ''}</div></div>`;
    }
    const state = it.queued
      ? '<span class="state-queued">Na fila</span>'
      : it.fromContext
        ? '<span class="state-read" title="Recuperada do context.md (state.json sem human_inputs)">Lida pelo agente</span>'
        : `<span class="state-read">Lida pelo agente ${esc(ago(it.readAt))}</span>`;
    return `<div class="msg me ${it.queued ? 'queued' : ''}"><div class="bubble">${esc(it.text)}</div>
      <div class="foot"><span>${esc(when(it.at))}</span>${state}</div></div>`;
  }).join('');
  if (r.pendingHumanInput && !queuedLocal) {
    html += '<div class="msg system">Há uma mensagem na fila enviada de outro navegador.</div>';
  }
  if (!html) {
    html = r.status === 'committed'
      ? '<div class="thread-empty"><strong>Nenhuma conversa neste run.</strong>Ele terminou sem precisar de instruções.</div>'
      : '<div class="thread-empty"><strong>Nada por aqui ainda.</strong>Escreva abaixo para corrigir o rumo, dar uma dica ou responder a um bloqueio. O agente recebe a mensagem antes do próximo passo, sem parar o watcher.</div>';
  }
  const stick = nearBottom(el);
  el.innerHTML = html;
  el.querySelectorAll('.msg.agent').forEach(m => {
    const b = m.querySelector('.bubble');
    if (b.scrollHeight > b.clientHeight + 4 && !m.querySelector('[data-expand]')) {
      b.classList.add('clipped');
      m.querySelector('.foot').insertAdjacentHTML('beforeend', '<button class="link-btn" type="button" data-expand>Ler tudo</button>');
    }
  });
  if (stick || !el.dataset.init) { el.scrollTop = el.scrollHeight; el.dataset.init = '1'; }
}

async function sendMessage(e) {
  e.preventDefault();
  const ta = $('message');
  const message = ta.value.trim();
  if (!selected || !message) return;
  const taskId = selected;
  $('send').disabled = true;
  const help = $('composerHelp');
  help.className = 'composer-help'; help.textContent = 'Enviando…';
  try {
    await api(`/api/runs/${encodeURIComponent(taskId)}/message`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }),
    });
    const h = [...sentHistory(), { taskId, message, at: new Date().toISOString() }]; save(HISTORY_KEY, h.slice(-300)); invalidateSentCache();
    delete prefs.drafts[taskId]; persist();
    if (selected === taskId) {
      ta.value = ''; ta.style.height = 'auto';
      help.className = 'composer-help ok'; help.textContent = 'Mensagem entregue. O agente lê antes do próximo passo.';
      const r = runs.get(taskId); if (r) r.pendingHumanInput = true;
      $('thread').dataset.init = '';
      renderThread(); renderSidebar();
    }
    toast('Mensagem entregue. O agente lê antes do próximo passo.');
  } catch (err) {
    help.className = 'composer-help err';
    help.textContent = `Não foi enviada: ${err.message}. O texto continua no campo.`;
  } finally {
    if ($('send')) $('send').disabled = !$('message').value.trim();

// ---------------------------------------------------------------- context.md
function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 40; }

let ctxSeq = 0;
async function loadContext(reset) {
  if (!selected) return;
  const seq = ++ctxSeq;
  const taskId = selected;
  const lines = prefs.ctxMode === 'all' ? 5000 : 100;
  try {
    const { log } = await api(`/api/runs/${encodeURIComponent(taskId)}/log?lines=${lines}`);
    if (seq !== ctxSeq || taskId !== selected) return;
    contextText = typeof log === 'string' ? log : ''; contextFor = taskId;
    renderContext(reset);
    if (!runs.get(taskId)?.state?.human_inputs?.length) renderThread();
  } catch (e) {
    if (seq === ctxSeq && $('ctx')) { contextText = ''; contextFor = taskId; renderContext(true); }
  }

// ---------------------------------------------------------------- Timeline de eventos
// state.events[] (gravado pelo watcher — scripts/lib/node-events.js e outros módulos)
// como lista cronológica: quando | tipo | nó | agente | detalhe. Filtro por categoria
// client-side (prefs.evFilter, vazio = todas). Tipos sem categoria própria (checkpoint,
// fully_merged, worktrees_removed…) caem em "outros" com o tipo cru no badge.
const EV_CATS = [
  ['node_start', 'node_start'], ['node_end', 'node_end'], ['retry', 'retry'],
  ['error', 'error'], ['escalation', 'escalation'], ['other', 'outros'],

  const t = String(type || '');
  if (t === 'node_start' || t === 'node_end') return t;
  if (/escalat/.test(t)) return 'escalation';
  if (/retry|replan|replay/.test(t)) return 'retry';
  if (/error|fail|corrupt|interrupt/.test(t)) return 'error';
  return 'other';
}
function sortedEvents(s) {
  const list = Array.isArray(s?.events) ? s.events.filter(e => e && typeof e === 'object') : [];
  return list.map((e, i) => ({ e, i, t: Date.parse(e.ts || e.at) || 0 }))
    .sort((a, b) => a.t - b.t || a.i - b.i).map(x => x.e);
}
function evFilter() { return new Set(Array.isArray(prefs.evFilter) ? prefs.evFilter : []); }
function eventsTimelineHtml(s) {
  const events = sortedEvents(s);
  if (!events.length) return '<div class="ctx-empty"><strong>Sem eventos</strong>O watcher ainda não gravou eventos em state.json deste run.</div>';
  const counts = {};
  for (const e of events) { const c = evCategory(e.type); counts[c] = (counts[c] || 0) + 1; }
  const active = evFilter();
  const chips = `<div class="ev-filters" role="group" aria-label="Filtrar por tipo de evento">
      <button type="button" class="ev-chip" data-evcat="" aria-pressed="${!active.size}">Todos <b>${events.length}</b></button>
      ${EV_CATS.map(([k, label]) => `<button type="button" class="ev-chip" data-evcat="${k}" aria-pressed="${active.has(k)}"${counts[k] ? '' : ' disabled'}>${label} <b>${counts[k] || 0}</b></button>`).join('')}
    </div>`;
  const rows = events.map(e => {
    const cat = evCategory(e.type);
    const iso = e.ts || e.at;
    const code = e.exit_code !== undefined && e.exit_code !== null ? `<small>exit ${esc(String(e.exit_code))}</small>` : '';
    return `<li class="ev-row" data-evcat="${cat}"${active.size && !active.has(cat) ? ' hidden' : ''}>
        <time class="ev-when" datetime="${esc(iso || '')}" title="${esc(when(iso) || iso || '')}">${esc(ago(iso) || '—')}</time>
        <span><span class="ev-badge c-${cat}" title="${esc(e.type || '')}">${esc(e.type || '?')}</span></span>
        <span class="ev-node">${esc(e.node ? (NODE_LABEL[e.node] || e.node) : '—')}</span>
        <span class="ev-agent">${esc(e.agent || '—')}</span>
        <span class="ev-detail">${esc(e.detail || '')}${code}</span>
      </li>`;
  }).join('');
  return `${chips}<ol class="ev-list">${rows}</ol>`;
}
// Aba "Transcrições" — state.transcripts[] (scripts/lib/transcript-writer.js): uma
// linha por nó/tentativa; expandir busca GET /api/runs/:taskId/transcript/:node-:attempt
// e mostra role | conteúdo | timestamp. Superfície principal de post-mortem de nó falho.
const transcriptsOf = s => (Array.isArray(s?.transcripts) ? s.transcripts.filter(t => t && t.nodeId && Number.isInteger(t.attempt)) : []);
function fmtBytes(n) {

  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}
function transcriptsHtml(s) {

  if (!list.length) return '<div class="ctx-empty"><strong>Sem transcrições</strong>O watcher grava uma por nó quando o agente termina (sucesso ou falha).</div>';
  const failed = list.filter(t => t.status === 'failed').length;
  const head = `<p class="tr-sum">${list.length} transcriç${list.length > 1 ? 'ões' : 'ão'} · ${esc(fmtBytes(s.transcripts_size_bytes ?? list.reduce((a, t) => a + (t.sizeBytes || 0), 0)))}${failed ? ` · <b class="tr-failed">${failed} com falha</b>` : ''}</p>`;
  const rows = list.map(t => {
    const u = t.tokenUsage || {};
    const tok = u.input_tokens != null || u.output_tokens != null ? `${fmtTok(u.input_tokens)} in · ${fmtTok(u.output_tokens)} out` : 'sem tokens';
    return `<details class="tr-item" data-trnode="${esc(t.nodeId)}" data-tratt="${esc(String(t.attempt))}"${t.status === 'failed' ? ' data-failed' : ''}>

          <span class="ev-badge ${t.status === 'failed' ? 'c-error' : 'c-node_end'}">${t.status === 'failed' ? 'falhou' : 'sucesso'}</span>

          <time class="tr-when" datetime="${esc(t.finishedAt || '')}" title="${esc(when(t.finishedAt) || '')}">${esc(ago(t.finishedAt) || '—')}</time>
        </summary>
        <div class="tr-body"><div class="ctx-empty">Carregando…</div></div>

}
function transcriptConversationHtml(doc) {
  const md = doc.metadata || {};
  const info = [md.model && `modelo ${md.model}`, md.exitCode != null && `exit ${md.exitCode}`, md.partial && 'transcrição parcial',
    md.startedAt && `início ${when(md.startedAt)}`, md.finishedAt && `fim ${when(md.finishedAt)}`].filter(Boolean).join(' · ');

  const rows = msgs.map(m => `<tr class="tr-msg r-${esc(String(m.role).replace(/[^a-z]/g, ''))}${m.apiError ? ' api-err' : ''}">

  return `<p class="tr-info">${esc(info)}</p><table class="tr-table"><thead><tr><th>role</th><th>conteúdo</th><th>timestamp</th></tr></thead><tbody>${rows}</tbody></table>`;

// renderDetail() roda a cada mudança de state.json do run selecionado (WebSocket) —

// Transcrição gravada não muda (nó+tentativa é imutável), então o cache é seguro.
const trView = { taskId: null, open: new Set(), docs: new Map(), scroll: 0 };
function wireTranscripts(r) {
  const pane = $('trPane');
  if (!pane) return;
  if (trView.taskId !== r.taskId) { trView.taskId = r.taskId; trView.open.clear(); trView.docs.clear(); trView.scroll = 0; }
  pane.addEventListener('scroll', () => { trView.scroll = pane.scrollTop; }, { passive: true });
  pane.querySelectorAll('details.tr-item').forEach(d => {
    const key = `${d.dataset.trnode}-${d.dataset.tratt}`;
    const body = d.querySelector('.tr-body');
    if (trView.docs.has(key)) body.innerHTML = transcriptConversationHtml(trView.docs.get(key));
    if (trView.open.has(key)) d.open = true;
    d.addEventListener('toggle', async () => {
      if (!d.open) { trView.open.delete(key); return; }
      trView.open.add(key);
      if (trView.docs.has(key) || d.dataset.loading) return;
      d.dataset.loading = '1';
      try {
        const doc = await api(`/api/runs/${encodeURIComponent(r.taskId)}/transcript/${encodeURIComponent(key)}`);
        trView.docs.set(key, doc);
        body.innerHTML = transcriptConversationHtml(doc);
      } catch (e) {
        body.innerHTML = `<div class="ctx-empty"><strong>Não foi possível carregar</strong>${esc(e.message)}</div>`;
      } finally {
        delete d.dataset.loading;
      }
    });
  });
  pane.scrollTop = trView.scroll;
}
const DETAIL_TABS = ['ctx', 'events', 'transcripts'];
const detailTab = () => (DETAIL_TABS.includes(prefs.detailTab) ? prefs.detailTab : 'ctx');
function wireEventsTimeline(r) {
  document.querySelectorAll('[data-dtab]').forEach(b => b.addEventListener('click', () => {
    prefs.detailTab = DETAIL_TABS.includes(b.dataset.dtab) ? b.dataset.dtab : 'ctx'; persist();
    const tab = detailTab();
    document.querySelectorAll('[data-dtab]').forEach(x => x.setAttribute('aria-selected', x === b));
    $('ctxPane').hidden = tab !== 'ctx'; $('ctxControls').hidden = tab !== 'ctx';
    $('evPane').hidden = tab !== 'events'; $('trPane').hidden = tab !== 'transcripts';
  }));
  $('evPane')?.addEventListener('click', e => {
    const chip = e.target.closest('[data-evcat]');
    if (!chip || chip.tagName !== 'BUTTON') return;
    const k = chip.dataset.evcat;
    const set = evFilter();
    if (!k) set.clear(); else if (set.has(k)) set.delete(k); else set.add(k);
    prefs.evFilter = [...set]; persist();
    $('evPane').querySelectorAll('.ev-chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.evcat ? set.has(c.dataset.evcat) : !set.size));
    $('evPane').querySelectorAll('.ev-row').forEach(row => { row.hidden = set.size > 0 && !set.has(row.dataset.evcat); });
  });
}

function renderContext(reset) {
  const el = $('ctx');
  if (!el) return;
  const stick = reset || nearBottom(el);
  const body = typeof contextText === 'string' && contextText.trim()
    ? `<div class="log">${renderLog(contextText)}</div>`
    : runs.get(selected)?.status === 'committed'
      ? '<div class="ctx-empty"><strong>Sem context.md</strong>Este run terminou sem deixar log de contexto.</div>'
      : '<div class="ctx-empty"><strong>⏳ Aguardando primeiro nó — log aparecerá em breve</strong>Nenhum log ainda. O context.md aparece aqui assim que o agente escrever nele.</div>';
  el.innerHTML = body + '<button id="jump" class="jump" type="button">Ir para o fim</button>';
  $('jump').onclick = () => { el.scrollTop = el.scrollHeight; };
  const marks = el.querySelectorAll('mark');
  if ($('ctxCount')) $('ctxCount').textContent = ctxQuery.trim() ? `${marks.length} resultado${marks.length === 1 ? '' : 's'}` : '';
  if (marks.length) marks[0].scrollIntoView({ block: 'center' });
  else if (stick) el.scrollTop = el.scrollHeight;
  $('jump').classList.toggle('show', !nearBottom(el));
}

// Texto puro -> HTML escapado com <mark> em cada ocorrência de q. O match é feito
// no texto cru (antes do esc), senão "amp" casaria dentro de "&amp;" e "a&b" nunca.
function highlight(text, q) {
  text = String(text ?? '');
  if (!q) return esc(text);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  let out = '', last = 0;
  for (const m of text.matchAll(re)) {
    out += esc(text.slice(last, m.index)) + `<mark>${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// context.md como texto pré-formatado (nada de parse de JSON nem de markdown), com
// uma divisória sutil entre seções `##`. Blocos "## Human input" ficam destacados.
function renderLog(src) {
  const sections = [];
  let cur = [];
  let inFence = false;
  for (const line of src.split('\n')) {
    if (/^\s*```/.test(line)) inFence = !inFence;
    if (!inFence && /^##\s/.test(line) && cur.some(l => l.trim())) { sections.push(cur); cur = []; }
    cur.push(line);
  }
  if (cur.some(l => l.trim())) sections.push(cur);
  return sections.map(lines => {
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    const human = /^##\s+Human input/.test(lines[0] || '');
    const q = ctxQuery.trim();
    const html = lines.map(l => /^#{1,6}\s/.test(l) ? `<span class="h">${highlight(l, q)}</span>` : highlight(l, q)).join('\n');
    return `<pre class="sec${human ? ' human' : ''}">${html}</pre>`;
  }).join('');
}

// ---------------------------------------------------------------- keyboard
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; renderSidebar(); $('q').blur(); return; }
  if (e.key === 'Escape' && selecting && !typing) { setSelecting(false); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selecting && !typing && picked.size) { e.preventDefault(); applyHide(); return; }
  if (!typing && !selecting && document.body.dataset.view === 'runs' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k')) {
    const ids = [...document.querySelectorAll('.run')].map(b => b.dataset.id);
    if (!ids.length) return;
    e.preventDefault();
    const i = ids.indexOf(selected);
    const next = (e.key === 'ArrowDown' || e.key === 'j') ? Math.min(i + 1, ids.length - 1) : Math.max(i - 1, 0);
    select(ids[i === -1 ? 0 : next], { quiet: true });
    document.querySelector(`.run[data-id="${CSS.escape(ids[i === -1 ? 0 : next])}"]`)?.focus();
  }
});

$('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  prefs.theme = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = prefs.theme;
  persist();
});

// ---------------------------------------------------------------- live updates
function flashRow(taskId) {
  const row = document.querySelector(`.run[data-id="${CSS.escape(taskId)}"]`);
  if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
}

let ws, backoff = 1000, retryTimer;
function setLive(state, text) { $('live').className = `live ${state}`; $('liveText').textContent = text; }

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => { backoff = 1000; setLive('on', 'Ao vivo'); };
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'hello') {
      setRuns(msg.runs); if (selected) loadContext(false);
      window.ContextMd?.refresh(); // reconexão: pode ter perdido context_update
      if (window.Views?.current() === 'coordenacao') window.CoordinationView?.load();
    } else if (msg.type === 'coordination_update') {
      if (window.Views?.current() === 'coordenacao') window.CoordinationView?.load();
    } else if (msg.type === 'state_update') {
      const prev = runs.get(msg.taskId);
      runs.set(msg.taskId, msg.run || { ...(prev || {}), taskId: msg.taskId, state: msg.state });
      const changed = JSON.stringify(prev) !== JSON.stringify(runs.get(msg.taskId));
      if (changed) lastRunsHash = ''; // próximo setRuns compara contra o estado novo
      renderSidebar({ views: changed }); flashRow(msg.taskId); updateTitle();
      if (msg.taskId === selected) { saveDraft(); renderDetail(); }
      const now = runs.get(msg.taskId);
      if (prev && now && prev.status !== now.status && (now.status === 'needs_human_review' || now.status === 'awaiting_approval')) {
        toast(`${titleOf(now).num || now.taskId} parou e precisa de você.`);
        window.UX?.notifyNeedsYou(now);
      }
    } else if (msg.type === 'context_update') {
      if (msg.taskId === selected) loadContext(true);
      window.ContextMd?.refresh(msg.taskId);
      // O watcher pode ter (re)gerado a checklist de migração neste context.md.
      if (schemaCache.has(msg.taskId)) { schemaCache.delete(msg.taskId); if (msg.taskId === selected) loadSchemaChecklist(msg.taskId, { force: true }); }
    } else if (msg.type === 'human_input') {
      const r = runs.get(msg.taskId);
      if (r) {
        const changed = r.pendingHumanInput !== msg.pending;
        r.pendingHumanInput = msg.pending;
        if (changed) lastRunsHash = '';
        renderSidebar({ views: changed }); if (msg.taskId === selected) renderThread();
      }
    } else if (msg.type === 'prebuild_ai_event') appendAiStep(msg.taskId, msg.event);
    else if (msg.type === 'runs_changed') refreshRuns();
  };
  ws.onclose = () => {
    let left = Math.round(backoff / 1000);
    setLive('off', `Sem conexão, tentando em ${left}s`);
    clearInterval(retryTimer);
    retryTimer = setInterval(() => { left--; if (left > 0) setLive('off', `Sem conexão, tentando em ${left}s`); }, 1000);
    setTimeout(() => { clearInterval(retryTimer); setLive('', 'Reconectando'); connect(); }, backoff);
    backoff = Math.min(backoff * 2, 30000);
  };
  ws.onerror = () => ws.close();
}

async function refreshRuns() {
  try { setRuns(await api('/api/runs')); }
  catch (e) { $('sidebar').innerHTML = `<div class="side-empty">Não foi possível carregar os runs: ${esc(e.message)}. Confira se o servidor do dashboard está rodando.</div>`; }
}

// Tempos relativos ("há 3 minutos") envelhecem sem evento nenhum.
setInterval(() => { if (!document.hidden) renderSidebar(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderSidebar(); });

refreshRuns();
connect();
stalePoller.start();
document.addEventListener('click', async e => {
  if (!e.target.closest('#staleReload')) return;
  serverVersions.delete(selected);
  await refreshRuns();
  renderDetail();
});

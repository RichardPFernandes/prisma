<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espectro — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M6.1 15 A20 20 0 0 1 41.9 15 Z' fill='%236E9BFF'/%3E%3Cpath d='M4.9 18 H43.1 A20 20 0 0 1 43.1 30 H4.9 A20 20 0 0 1 4.9 18 Z' fill='%233DD68C'/%3E%3Cpath d='M6.1 33 H41.9 A20 20 0 0 1 6.1 33 Z' fill='%23F2A93B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prisma-theme.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* Tokens, base, shell e componentes compartilhados: prisma-theme.css + theme.css. */
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 0; }

  /* Lista lateral, detalhe do run, conversa, visão geral, paleta e toast: screens/runs.css. */
  /* Gaveta lateral do log do agente (GET /api/runs/:taskId/agent-log[/stream]) */
  .log-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); z-index: 60;
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 28px rgba(0,0,0,.2);
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
  }
  .log-drawer.open { transform: translateX(0); }
  .log-drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0; }
  .log-drawer-head h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  .log-drawer-body {
    flex: 1; overflow-y: auto; padding: 10px 14px 16px; background: var(--sunken);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .log-drawer-empty { color: var(--muted); padding: 24px 4px; text-align: center; }
  .log-line { display: flex; gap: 8px; padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: var(--faint); flex-shrink: 0; }
  .log-line .src { flex-shrink: 0; font-weight: 700; }
  .log-line.watcher .src { color: var(--signal); }
  .log-line.claude .src { color: var(--muted); }
  .log-line .msg { color: var(--ink-2); }
  .contract-yaml { margin: 0; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; font: inherit; }
  /* Gaveta do context.md (public/context-md.js + public/markdown.js): mesma .log-drawer. */
  .ctxmd-drawer { width: min(760px, 94vw); }
  .ctxmd-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ctxmd-seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .ctxmd-seg button[aria-pressed="true"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
  .log-drawer-body.md-mode { background: var(--surface); padding: 14px 20px 28px; font-family: inherit; font-size: 14px; line-height: 1.6; }
  .md-body { color: var(--ink-2); overflow-wrap: anywhere; }
  .md-body > :first-child { margin-top: 0; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { color: var(--ink); line-height: 1.3; margin: 1.3em 0 .5em; }
  .md-body h1 { font-size: 20px; } .md-body h2 { font-size: 17px; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
  .md-body h3 { font-size: 15px; } .md-body h4, .md-body h5, .md-body h6 { font-size: 14px; }
  .md-body p, .md-body ul, .md-body ol, .md-body blockquote, .md-body pre, .md-body .md-table { margin: 0 0 .8em; }
  .md-body ul, .md-body ol { padding-left: 1.4em; } .md-body li > ul, .md-body li > ol { margin: .2em 0; }
  .md-body li.md-task { list-style: none; margin-left: -1.3em; }
  .md-body code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--sunken); border-radius: 4px; padding: 1px 4px; }
  .md-body pre.md-code { background: var(--sunken); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md-body pre.md-code code { background: none; padding: 0; white-space: pre; }
  .md-body blockquote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; color: var(--muted); }
  .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .md-body .md-table { overflow-x: auto; }
  .md-body table { border-collapse: collapse; font-size: 13px; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md-body th { background: var(--sunken); color: var(--ink); }
  .md-body a { color: var(--signal); }

  .ctx { overflow: auto; max-height: 72vh; min-height: 260px; padding: 6px 22px 22px; position: relative; }
  .log { font: 12.5px/1.6 var(--mono); color: var(--ink-2); }
  .log .sec { margin: 0; padding: 14px 0; white-space: pre-wrap; word-break: break-word; }
  .log .sec + .sec { border-top: 1px solid var(--line-soft); }
  .log .h { color: var(--ink); font-weight: 600; }
  .log .sec.human { background: var(--signal-soft); border-left: 3px solid var(--signal); padding-left: 12px; margin: 6px 0; border-radius: 6px; border-top: 0; }
  .log .sec.human + .sec { border-top: 0; }
  .ctx-empty { color: var(--muted); padding: 28px 0; font-size: 14px; }
  /* Aba "Timeline de Eventos" do painel de contexto — state.events[] estruturado. */
  .ctx-tabs { flex: none; }
  .ev-row[hidden], .ev-pane[hidden], #ctxControls[hidden], #ctxPane[hidden] { display: none; }
  .ctx-tabs .count { color: var(--faint); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .ev-pane { max-height: 72vh; min-height: 260px; overflow: auto; padding: 12px 18px 18px; }
  .ev-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ev-chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font: 500 12.5px/1.5 var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .ev-chip:hover { border-color: var(--faint); }
  .ev-chip[aria-pressed="true"] { background: var(--signal-soft); border-color: var(--signal); color: var(--ink); }
  .ev-chip b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
  .ev-chip:disabled { opacity: .45; cursor: default; }
  .ev-list { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .ev-row { display: grid; grid-template-columns: 92px 128px 96px 76px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
  .ev-row:last-child { border-bottom: 0; }
  .ev-row .ev-when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev-row .ev-node { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .ev-row .ev-agent { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .ev-row .ev-detail { color: var(--ink-2); overflow-wrap: anywhere; }
  .ev-row .ev-detail small { color: var(--faint); font-family: var(--mono); font-size: 11.5px; margin-left: 6px; }
  .ev-badge { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 5px; padding: 1px 7px; font: 600 11.5px/1.6 var(--mono); background: var(--sunken); color: var(--ink-2); }
  .ev-badge.c-node_start { background: var(--signal-soft); color: var(--signal); }
  .ev-badge.c-node_end { background: var(--clear-bg); color: var(--clear); }
  .ev-badge.c-retry { background: var(--attention-bg); color: var(--attention); }
  .ev-badge.c-error { background: var(--stop-bg); color: var(--stop); }
  .ev-badge.c-escalation { background: var(--session-limit-bg); color: var(--session-limit); }
  @media (max-width: 720px) {
    .ev-row { grid-template-columns: auto auto minmax(0, 1fr); row-gap: 2px; }
    .ev-row .ev-agent { justify-self: end; }
    .ev-row .ev-detail { grid-column: 1 / -1; }
  }
  /* Aba "Transcrições" — state.transcripts[] + GET /api/runs/:taskId/transcript/:nodeId. */
  #trPane[hidden] { display: none; }
  .tr-sum { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .tr-sum .tr-failed { color: var(--stop); font-weight: 600; }
  .tr-list { display: flex; flex-direction: column; gap: 6px; }
  .tr-item { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .tr-item[data-failed] { border-color: var(--stop); }
  .tr-item > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px minmax(90px, auto) auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; font-size: 13.5px; }
  .tr-item > summary::-webkit-details-marker { display: none; }
  .tr-item > summary svg { transition: transform .15s; }
  .tr-item[open] > summary svg { transform: rotate(90deg); }
  .tr-node { font-weight: 600; color: var(--ink); }
  .tr-node small { color: var(--faint); font-weight: 500; }
  .tr-meta { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-when { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .tr-body { border-top: 1px solid var(--line-soft); padding: 8px 12px 12px; }
  .tr-info { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; font-family: var(--mono); overflow-wrap: anywhere; }
  .tr-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
  .tr-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .tr-table th:first-child { width: 96px; } .tr-table th:last-child { width: 84px; }
  .tr-table td { vertical-align: top; padding: 6px; border-bottom: 1px solid var(--line-soft); }
  .tr-role { font: 600 12px/1.5 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
  .tr-role small { font-weight: 500; color: var(--faint); }
  .tr-msg.r-assistant .tr-role { color: var(--signal); }
  .tr-msg.r-tool .tr-role { color: var(--muted); }
  .tr-msg.r-system .tr-role, .tr-msg.api-err .tr-role { color: var(--stop); }
  .tr-content pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; font: 12px/1.5 var(--mono); color: var(--ink); }
  .tr-ts { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 720px) {
    .tr-item > summary { grid-template-columns: 16px auto auto; }
    .tr-item > summary .tr-meta, .tr-item > summary .tr-when { grid-column: 2 / -1; }
    .tr-table th:first-child { width: 64px; } .tr-table th:last-child { width: 60px; }
  }
  .ctx-find { position: relative; display: flex; align-items: center; gap: 8px; }
  .ctx-find input { width: 170px; border: 1px solid var(--line); background: var(--sunken); border-radius: 7px; padding: 4px 9px; font-size: 13px; }
  .ctx-find input:focus { outline: none; border-color: var(--signal); background: var(--surface); }
  .ctx-find span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .log mark, .run .title mark { background: #fde68a; color: #1b2430; border-radius: 2px; padding: 0 1px; }
  .panel-head { flex-wrap: wrap; }
  .ctx-empty strong { display: block; color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }


  /* Risco alto (state.risk_level === "high", gravado pelo /verify). Vermelho de --stop,
     com borda, pra não confundir com o chip/lâmpada de status nem com o badge de PR. */
  .risk-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--stop); color: var(--surface); font-size: 11px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  .risk-flag {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 0 7px; border-radius: 4px; background: var(--stop); color: var(--surface);
    font-size: 11px; font-weight: 700; letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  /* Mudança de schema (state.schema_changes_detected, watcher: scripts/lib/schema-watcher.js).
     Mesmo formato do .risk-badge do PR; cor pelo schema_risk_level: low amarelo, medium
     laranja, high vermelho. */
  .schema-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    color: var(--surface); font-size: 11px; font-weight: 700; letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  .sub .schema-badge { margin-left: 0; }
  /* Churn de implementação (state.status === "churn-escalation", watcher: scripts/lib/churn-detector.js).
     Mesmo formato do .risk-badge, em laranja: parado por loop de re-implement, não por falha comum. */
  .churn-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--warm); color: var(--surface); font-size: 11px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  .churn-files { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .churn-files li { border-left: 3px solid var(--warm); padding: 2px 0 2px 10px; min-width: 0; }
  .churn-files .churn-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .churn-files code { overflow-wrap: anywhere; }
  .churn-files .churn-count { color: var(--warm); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .churn-files ol { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .churn-files ol li { border: 0; padding: 0; overflow-wrap: anywhere; }
  .schema-badge.low { background: var(--attention); }
  .schema-badge.medium { background: var(--warm); }
  .schema-badge.high { background: var(--stop); }
  .mig-body h5 { margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .mig-body p { margin: 4px 0; color: var(--ink-2); }
  .mig-body blockquote { margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; }
  .mig-body code { font-family: var(--mono); font-size: 12.5px; background: var(--sunken); padding: 0 4px; border-radius: 3px; word-break: break-word; }
  .mig-list { margin: 4px 0; padding-left: 18px; }
  .mig-list li { margin: 3px 0; color: var(--ink-2); word-break: break-word; }
  .mig-list li.mig-check { list-style: none; margin-left: -18px; }
  .mig-list li.mig-check label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .mig-list li.mig-check input { margin-top: 3px; flex: none; }
  .mig-list li.mig-check.done span { color: var(--muted); text-decoration: line-through; }
  .mig-actions { display: flex; gap: 10px; align-items: center; margin: 2px 0 8px; flex-wrap: wrap; }
  .mig-actions .fold-msg { margin: 0; font-size: 13px; }
  .station.high-risk .stop { box-shadow: 0 0 0 3px var(--stop-bg), 0 0 0 5px var(--stop); }
  .risk-box {
    margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--stop-bg);
    border-left: 4px solid var(--stop);
  }
  .risk-box h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--stop); letter-spacing: .02em; }
  .risk-box p { margin: 0; color: var(--ink); font-size: 14.5px; font-weight: 500; white-space: pre-wrap; word-break: break-word; }
  .risk-box small { display: block; margin-top: 6px; color: var(--ink-2); font-size: 12.5px; }

  /* Spec com "## Decisões de Implementação" (APPEND do /implement, server.js >
     specDecisionsOf). Azul de --signal: informativo — o Review confere, não é alerta. */
  .spec-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--signal-soft); color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal);
    font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1.6; white-space: nowrap;
  }

  /* Spec auto-reparada esperando aprovação (status spec-pending-approval do watcher).
     Amarelo de --attention: é o humano que destrava, mas não é falha. */
  .approval-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--attention-bg); color: var(--attention); box-shadow: inset 0 0 0 1px var(--attention-line);
    font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1.6; white-space: nowrap;
  }
  .approval-box dl.spec-change { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
  .approval-box dl.spec-change dt { font-weight: 600; }
  .approval-box dl.spec-change dd { margin: 0; overflow-wrap: anywhere; }
  .auth-box .err { color: var(--risk, #b42318); }
  .auth-box .auth-sql pre { max-height: 320px; overflow: auto; }
  .auth-box .auth-field { display: block; margin: 8px 0; font-weight: 600; }
  .auth-box .auth-field textarea { display: block; width: 100%; margin-top: 4px; font: inherit; font-weight: 400; }
  .auth-box .auth-history ul { margin: 6px 0 0; padding-left: 18px; }
  .approval-box {
    margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--attention-bg);
    border-left: 4px solid var(--attention);
  }
  .approval-box h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--attention); letter-spacing: .02em; }
  .approval-box p { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
  .approval-box .approval-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .approval-box .approval-meta b { color: var(--ink-2); font-weight: 600; }
  .approval-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .approval-actions .send { margin-left: 0; }
  .approval-msg { font-size: 13px; color: var(--muted); }
  .approval-msg.ok { color: var(--clear); font-weight: 500; }
  .approval-msg.err { color: var(--stop); font-weight: 500; }
  .draft-diff {
    margin: 10px 0 0; max-height: 50vh; overflow: auto; padding: 10px 12px; border-radius: 8px;
    background: var(--clear-bg); color: var(--clear); border: 1px solid var(--line-soft);
    font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  }

  /* Seções colapsáveis (Redmine / PR) */
  .folds { display: grid; gap: 10px; margin-top: 18px; }
  .fold { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .fold > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    font-weight: 600; font-size: 14px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary .chev { transform: rotate(-90deg); color: var(--faint); transition: transform .15s; }
  .fold[open] > summary .chev { transform: none; }
  .fold > summary .sum-right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font-weight: 500; font-size: 13px; color: var(--muted); }
  .fold-body { padding: 4px 16px 16px 36px; font-size: 14px; }
  .fold-msg { color: var(--muted); }
  .fold-msg.warn { color: var(--attention); }
  .fold-msg.err { color: var(--stop); }
  /* Custo por etapa (state.json.cost_tracking, gravado pelo watcher) */
  .cost-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .cost-table th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; white-space: nowrap; }
  .cost-table td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  .cost-table .n, .cost-table th.n { text-align: right; }
  .cost-table tfoot td { font-weight: 700; border-bottom: 0; }
  .cost-table small { color: var(--muted); font-weight: 400; }
  .cost-wrap { overflow-x: auto; }
  .cost-note { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  .cost-attempts { margin-top: 24px; }
  #foldCost, .cost-attempts, .cost-attempt { min-width: 0; }
  #foldCost .cost-note { overflow-wrap: anywhere; }
  .cost-source { margin-top: 8px; font-size: 12.5px; }
  .cost-source > summary { cursor: pointer; color: var(--muted); }
  .cost-attempts h4 { margin: 20px 0 8px; }
  .cost-attempt { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .cost-attempt > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
  .cost-attempt > summary::before { content: '▸'; }
  .cost-attempt[open] > summary::before { content: '▾'; }
  .cost-attempt > summary > span:first-of-type { flex: 1 1 220px; min-width: 0; }
  .cost-attempt > summary > span:last-of-type { margin-left: auto; }
  .cost-attempt code, .cost-pricing { overflow-wrap: anywhere; }
  .cost-attempt-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .cost-attempt-meta dt { color: var(--muted); font-size: 12px; }
  .cost-attempt-meta dd { margin: 4px 0 0; overflow-wrap: anywhere; }
  .cost-usage { margin-top: 12px; }
  .cost-usage caption { text-align: left; color: var(--muted); padding: 4px 0 8px; }
  .cost-usage td.n { white-space: nowrap; }
  /* Recusas QA separadas do ciclo principal (run.qaCycles — scripts/lib/qa-cycles.js). */
  .qa-cycles { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .qa-cycle { min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .qa-cycle.main { background: color-mix(in srgb, var(--line) 25%, transparent); }
  .qa-cycle.rej { border-left: 3px solid var(--risk); }
  .qa-cycle.pending { border-left: 3px dashed var(--risk); }
  .qa-cycle-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .qa-cycle-head strong { font-size: 14px; }
  .qa-cycle-head .sit { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--line) 60%, transparent); }
  .qa-cycle-head .sit.committed { color: var(--clear); }
  .qa-cycle-head .sit.running { color: var(--signal); }
  .qa-cycle-head .sit.blocked { color: var(--attention); }
  .qa-cycle-head .sit.rejected { color: var(--risk); }
  .qa-cycle-head .sit-arrow { color: var(--muted); font-size: 12px; }
  .qa-cycle-head strong small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .qa-pending-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; }
  .qa-pending-actions small { color: var(--muted); font-size: 12.5px; flex: 1 1 260px; min-width: 0; }
  .qa-cycle-meta { display: flex; gap: 4px 14px; flex-wrap: wrap; margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
  .qa-cycle-meta b { color: var(--text, inherit); font-weight: 600; }
  .qa-note { margin: 8px 0 0; padding: 8px 10px; border-radius: 6px; background: color-mix(in srgb, var(--risk) 7%, transparent); white-space: pre-wrap; font-size: 13px; max-height: 12em; overflow: auto; }
  .qa-steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .qa-steps li { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; }
  .qa-steps .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .qa-steps .txt { overflow-wrap: anywhere; }
  .qa-steps .txt small { color: var(--muted); }
  .qa-prs { margin: 6px 0 0; font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
  /* Portão de build pré-implement (state.json.preBuildStatus — scripts/lib/build-validator.js):
     marcador na fronteira plan→implement do rail. */
  .gate {
    position: absolute; left: 0; top: 13px; transform: translate(-50%, -50%); z-index: 2;
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 2px solid var(--idle); color: var(--muted); font-size: 11px; font-weight: 700; line-height: 1;
  }
  .gate svg { width: 10px; height: 10px; }
  .gate.passed { background: var(--clear); border-color: var(--clear); color: var(--surface); }
  .gate.failed { background: var(--stop); border-color: var(--stop); color: var(--surface); box-shadow: 0 0 0 4px var(--stop-bg); }
  .gate-label {
    position: absolute; left: 0; top: -14px; transform: translateX(-50%); z-index: 2; white-space: nowrap;
    font: 600 10.5px/1 var(--mono); letter-spacing: .02em; color: var(--muted);
  }
  .gate-label.passed { color: var(--clear); }
  .gate-label.failed { color: var(--stop); }
  .build-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .build-badge.failed { background: var(--stop-bg); color: var(--stop); }
  .build-badge.accepted { background: var(--attention-bg); color: var(--attention); }
  .build-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 4px 0 10px; }
  .build-actions .hint { color: var(--muted); font-size: 13px; }
  .retry-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  .retry-btn:hover:not(:disabled) { border-color: var(--signal); color: var(--signal); }
  .retry-btn:disabled { opacity: .65; cursor: progress; }
  /* "✨ Corrigir com IA" (POST /pre-build/ai-fix): botão primário + painel de passos ao vivo. */
  .retry-btn.ai { background: var(--signal); border-color: var(--signal); color: var(--surface); }
  .retry-btn.ai:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
  .retry-btn.stop { padding: 3px 10px; font-size: 12.5px; margin-left: auto; }
  .retry-btn.stop:hover:not(:disabled) { border-color: var(--stop); color: var(--stop); }
  .build-badge.ok { background: var(--clear-bg); color: var(--clear); }
  .ai-fix { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; background: var(--sunken); overflow: hidden; }
  .ai-fix.running { border-color: var(--signal); }
  .ai-fix.passed { border-color: var(--clear); }
  .ai-fix.failed, .ai-fix.error { border-color: var(--stop); }
  .ai-fix-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .ai-fix-head .hint { color: var(--muted); font-size: 12.5px; }
  .ai-fix-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
  .ai-fix.running .ai-fix-status { color: var(--signal); }
  .ai-fix.passed .ai-fix-status { color: var(--clear); }
  .ai-fix.failed .ai-fix-status, .ai-fix.error .ai-fix-status { color: var(--stop); }
  .ai-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ai-spin .8s linear infinite; }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ai-spin { animation: none; } }
  .ai-steps { list-style: none; margin: 0; padding: 6px 0; max-height: 360px; overflow-y: auto; font-size: 12.5px; }
  .ai-step { display: grid; grid-template-columns: 16px auto 1fr; gap: 0 8px; padding: 3px 12px; align-items: baseline; }
  .ai-step time { color: var(--faint); font: 11px/1.4 var(--mono); }
  .ai-ico { text-align: center; color: var(--muted); }
  .ai-txt { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
  .ai-step.tool .ai-txt, .ai-step.diff .ai-txt, .ai-step.log .ai-txt { font-family: var(--mono); font-size: 11.5px; }
  .ai-step.log .ai-txt { color: var(--faint); }
  .ai-step.text .ai-txt { color: var(--ink); }
  .ai-step.phase .ai-txt { color: var(--muted); font-style: italic; }
  .ai-step.tool_error .ai-txt, .ai-step.tool_error .ai-ico, .ai-step.build.bad .ai-txt { color: var(--stop); }
  .ai-step.result .ai-txt, .ai-step.build.ok .ai-txt { color: var(--clear); font-weight: 600; }
  .ai-step.result small { color: var(--muted); font-weight: 400; }
  /* Recusa QA (run.qaRejected — ticket_status "Recusa QA"/"Recusada QA"): linha com tint
     vermelho, badge e botão "Corrigir recusa QA" (POST /api/runs/:taskId/retry-qa-rejection). */
  .run.qa-rejected:not([aria-current="true"]):not(.picked) { background: color-mix(in srgb, var(--risk) 8%, transparent); }
  .run.qa-rejected:not([aria-current="true"]):not(.picked):hover { background: color-mix(in srgb, var(--risk) 13%, transparent); }
  .qa-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--risk); color: var(--surface); font-size: 11px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  /* PRI-184: retry-signal.json parado (qaRetryBlocked) — distinto de Recusa QA e de “em andamento”. */
  .qa-blocked-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--attention); color: var(--surface); font-size: 11px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  .qa-blocked-msg { color: var(--attention); font-size: 12.5px; font-weight: 600; }
  .qa-count { color: var(--risk); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .qa-actions { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; min-width: 0; }
  .qa-retry-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 7px;
    border: 1px solid var(--risk); background: var(--surface); color: var(--risk);
    font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .qa-retry-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--risk) 12%, var(--surface)); }
  .qa-retry-btn:disabled { opacity: .7; cursor: progress; }
  .qa-spinner {
    width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: qa-spin .8s linear infinite;
  }
  @keyframes qa-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .qa-spinner { animation-duration: 2.4s; } }
  /* session_limit (run.state.status — sub-status bruto, ver runStatus() em
     dashboard/server.js): badge + botão "▶ Retomar sessão"
     (POST /api/runs/:taskId/resume-session), mesmo padrão visual de qa-badge/
     qa-retry-btn acima, cor dedicada (--session-limit) em vez de --risk. */
  .session-limit-badge {
    display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 0 7px; border-radius: 4px;
    background: var(--session-limit); color: var(--surface); font-size: 11px; font-weight: 700;
    letter-spacing: .03em; line-height: 1.6; white-space: nowrap;
  }
  .resume-actions { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; min-width: 0; }
  .resume-session-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 7px;
    border: 1px solid var(--session-limit); background: var(--surface); color: var(--session-limit);
    font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .resume-session-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--session-limit) 12%, var(--surface)); }
  .resume-session-btn:disabled { opacity: .7; cursor: progress; }
  .resume-err { color: var(--session-limit); font-size: 12px; }
  .resume-ok { color: var(--clear); font-size: 12px; font-weight: 600; }
  .qa-err { color: var(--risk); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
  /* Replay de ciclo (state.replayOf — scripts/lib/cycle-replayer.js) */
  .replay-facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 4px 0 0; font-size: 13.5px; }
  .replay-facts dt { color: var(--muted); }
  .replay-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .run-link { padding: 0; border: 0; background: none; color: var(--signal); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .replay-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .replay-actions select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px; }
  .replay-actions .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; }
  .replay-actions .hint.err { color: var(--stop); }
  .build-errors { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .build-errors li { padding: 8px 10px; border-radius: 8px; background: var(--sunken); border-left: 3px solid var(--stop); font-size: 13.5px; line-height: 1.45; word-break: break-word; }
  .build-errors code { font: 500 12.5px/1.45 var(--mono); color: var(--ink); }
  .build-errors span { color: var(--ink-2); }
  /* Score do plano (state.json.planScore, portão do watcher — scripts/lib/plan-scorer.js) */
  .plan-meter { position: relative; flex: 0 0 140px; height: 8px; border-radius: 4px; background: var(--line); overflow: visible; }
  .plan-meter > i { display: block; height: 100%; border-radius: 4px; }
  .plan-meter > i.low { background: var(--stop); }
  .plan-meter > i.mid { background: var(--attention); }
  .plan-meter > i.high { background: var(--clear); }
  .plan-meter > b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink-2); border-radius: 1px; }
  .plan-score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
  .plan-score small { color: var(--muted); font-weight: 500; }
  .attempt-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--attention-bg); color: var(--attention); border: 1px solid var(--attention-line); }
  .plan-feedback { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; }
  .plan-feedback li { line-height: 1.4; }
  .tk-title { font-size: 16px; font-weight: 700; color: var(--ink); text-decoration: none; line-height: 1.35; }
  .tk-title:hover { text-decoration: underline; }
  .tk-facts { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 8px 0 10px; color: var(--muted); }
  .tk-facts b { color: var(--ink-2); font-weight: 500; }
  .progress { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--clear); }
  .ext { color: var(--signal); font-weight: 600; font-size: 13.5px; text-decoration: none; }
  .ext:hover { text-decoration: underline; }
  .pr-item { padding: 12px 0; display: grid; gap: 6px; }
  .pr-item + .pr-item { border-top: 1px solid var(--line-soft); }
  .pr-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pr-head .repo { font-weight: 600; }
  .pr-head .ttl { color: var(--ink); }
  .pr-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .pr-meta b { color: var(--ink-2); font-weight: 500; }
  /* PR Matrix: uma linha por repo — status, última checagem do watcher, link */
  .pr-matrix { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .pr-matrix-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 14px; font-weight: 600; font-size: 14px; }
  .pr-matrix-head .count { color: var(--muted); font-weight: 500; font-size: 13px; }
  .pr-matrix-head .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 13px; }
  .pr-matrix > .fold-msg { margin: 0; padding: 0 14px 8px; font-size: 13px; }
  .pr-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 112px minmax(120px, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 14px; font-size: 14px; border-top: 1px solid var(--line-soft); }
  .pr-row.cols { padding-top: 7px; padding-bottom: 7px; color: var(--faint); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .pr-row .repo { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .pr-row .checked { color: var(--muted); font-size: 13px; }
  .pr-row .detail { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 16px; color: var(--muted); font-size: 13px; }
  .pr-row .detail b { color: var(--ink-2); font-weight: 500; }
  .pr-row .detail.err { color: var(--stop); }
  @media (max-width: 640px) {
    .pr-row { grid-template-columns: 1fr auto; }
    .pr-row.cols { display: none; }
  }
  /* Tela desatualizada (public/state-version.js): o run mudou depois que a tela carregou. Não bloqueia. */
  .stale-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; padding: 10px 14px; border-radius: 10px;
    background: var(--attention-bg); border-left: 4px solid var(--attention); color: var(--ink); font-size: 14px; }
  .stale-banner[hidden] { display: none; }
  .stale-banner button { margin-left: auto; }
  .pr-banner { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--stop-bg); border-left: 4px solid var(--stop); }
  .pr-banner.warn { background: var(--attention-bg); border-left-color: var(--attention); }
  .pr-banner h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--stop); letter-spacing: .02em; }
  .pr-banner.warn h4 { color: var(--attention); }
  .pr-banner p { margin: 0; color: var(--ink); font-size: 14.5px; font-weight: 500; }
  .pr-banner small { display: block; margin-top: 6px; color: var(--ink-2); font-size: 12.5px; }
  .approved { color: var(--clear); font-weight: 600; }
  .refresh {
    border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 10px;
    font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer;
  }
  .refresh:hover { border-color: var(--faint); }
  .refresh:disabled { opacity: .5; cursor: wait; }
  /* ------------------------------------------------------------ Abas / visões */
  .view { display: none; overflow: auto; min-height: 0; }
  body:not([data-view="runs"]) .layout { display: none; }
  body:not([data-view="runs"]) .view { display: block; }
  .vhead { display: grid; gap: 4px; margin-bottom: 18px; }
  .vhead h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; }
  .vhead p { margin: 0; color: var(--muted); font-size: 14px; max-width: 80ch; }
  .vtools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; }
  .vtools.filters label { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
  .vtools select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 8px; font-size: 13.5px; }
  .vtools .chk { cursor: pointer; }
  .vempty { color: var(--muted); padding: 40px 0; text-align: center; }
  .muted { color: var(--faint); }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg-ctl button { border: 0; background: none; padding: 5px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg-ctl button + button { border-left: 1px solid var(--line-soft); }
  .seg-ctl button[aria-pressed="true"] { background: var(--signal-soft); color: var(--signal); font-weight: 600; }
  .seg-ctl .count { color: var(--faint); font-weight: 500; }
  .lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex-shrink: 0; }

  /* Quadro, Tabela, Linha do tempo, Métricas e Tickets e PRs (views.js): screens/run-views.css. */
  /* Tabela genérica rolável (coordination.js). */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

  /* Badge de status do TICKET Redmine (ticketStatusBadge, index.html) — reusado na
     sidebar, no detalhe do run, em "Tickets e PRs" e em "Meus Tickets". Cores
     reaproveitadas dos tokens já existentes (nunca inventar cor nova aqui). */
  .tk-status { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.7; white-space: nowrap; letter-spacing: .01em; }
  .tk-status-signal { background: var(--signal-soft); color: var(--signal); }
  .tk-status-attention { background: var(--attention-bg); color: var(--attention); }
  .tk-status-clear { background: var(--clear-bg); color: var(--clear); }
  .tk-status-risk { background: var(--stop-bg); color: var(--stop); }
  .tk-status-idle { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }

  .viz-tip {
    position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.45;
    max-width: 320px; box-shadow: var(--shadow);
  }
  .viz-tip.show { opacity: 1; }

  @media (max-width: 1180px) {
    .work { grid-template-columns: 1fr; }
    .ctx { max-height: 60vh; }
  }
  @media (max-width: 820px) {
    .cmd-btn span { display: none; }
    .ov-grid { grid-template-columns: 1fr; }
    .ov-cards { grid-template-columns: 1fr; }
    .ctx-find input { width: 130px; }
    .layout { display: block; }
    .sidebar { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .detail { padding: 20px 16px; }
    .hero { padding: 18px 16px; }
    .hero-top { flex-wrap: wrap; }
    .status-chip { margin-left: 0; }
    .hero h1 { font-size: 20px; }
    .rail { grid-template-columns: 1fr; margin: 22px 0 0; }
    .station { grid-template-columns: 34px 1fr; justify-items: start; align-items: center; text-align: left; gap: 12px; padding: 6px 0; }
    .station .stop { justify-self: center; }
    .station.current .stop { margin-top: 0; }
    .station::before, .station::after { top: auto; height: auto; width: 4px; left: 15px; right: auto; }

const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
function ago(iso) {
  const t = Date.parse(iso);

  if (abs < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(s / 3600), 'hour');

function appendLogLine(raw) {

  send: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7-7-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  copy: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg>',
  link: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  chevLeft: '<svg class="lead" width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

// ---------------------------------------------------------------- pull requests
// Mesmo formato normalizado de server.js > extractPrs (state.pull_request tem várias formas).
const PR_URL_RE = /bitbucket\.org\/([^/]+)\/([^/]+)\/pull-requests?\/(\d+)/i;
function prEntry(repo, value) {
  const v = typeof value === 'string' ? { url: value } : value;
  if (!v || typeof v !== 'object') return null;
  const url = [v.url, v.pr_url, v.links?.html?.href].find(u => typeof u === 'string' && /^https?:\/\//i.test(u)) || null;
  const m = url ? url.match(PR_URL_RE) : null;
  const id = Number(v.id ?? v.number ?? (url && (url.match(/\/pull-requests?\/(\d+)/i) || [])[1])) || null;
  if (!url && !id) return null;
  const st = v.state || v.status;
  const checked = typeof v.last_checked_at === 'string' ? v.last_checked_at : null;
  return { repo: repo || (m && m[2]) || null, id, url, state: typeof st === 'string' ? st.toUpperCase() : null, last_checked_at: checked };
}
function extractPrs(pr) {
  if (!pr) return [];
  if (typeof pr === 'string') return [prEntry(null, pr)].filter(Boolean);
  if (typeof pr !== 'object') return [];
  const flat = ['url', 'pr_url', 'links', 'number', 'id', 'title'].some(k => k in pr && (k === 'links' || typeof pr[k] !== 'object'));
  const list = flat ? [prEntry(null, pr)] : Object.entries(pr).map(([repo, v]) => prEntry(repo, v));
  return list.filter(Boolean);
}
const PR_STATES = ['OPEN', 'MERGED', 'DECLINED', 'SUPERSEDED'];
// Estado mais atual conhecido: o do Bitbucket (se já buscado) > o gravado no state.json.
function prState(taskId, p) {
  const live = prCache.get(taskId)?.data?.prs?.find(x => x.id === p.id && (!p.repo || x.repo === p.repo));
  const st = live?.state || p.state;
  return PR_STATES.includes(st) ? st : '';
}
function prBadge(taskId, p) {
  const label = p.id ? `PR #${p.id}` : 'PR ↗';
  const st = prState(taskId, p);
  const title = [p.repo, st].filter(Boolean).join(' — ') || 'Abrir PR';
  return p.url
    ? `<a class="pr-badge ${st}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" title="${esc(title)}">${esc(label)}</a>`
    : `<span class="pr-badge ${st}" title="${esc(title)}">${esc(label)}</span>`;
}

// Linhas da PR Matrix: TODOS os repos de state.pull_request (inclusive o registrado
// sem URL/ID de PR), com o estado mais atual conhecido — Bitbucket ao vivo (se já
// buscado) > o gravado pelo polling do watcher (status/last_checked_at).
function prRows(r) {
  const pr = r?.state?.pull_request;
  const rows = extractPrs(pr);
  if (pr && typeof pr === 'object' && !rows.some(p => !p.repo)) {
    for (const repo of Object.keys(pr)) if (!rows.some(p => p.repo === repo)) rows.push({ repo, id: null, url: null, state: null, last_checked_at: null });
  }
  const live = prCache.get(r?.taskId)?.data?.prs || [];
  return rows.map(p => {
    const l = p.id ? live.find(x => x.id === p.id && (!p.repo || x.repo === p.repo)) : null;
    const st = (l && !l.error && l.state) || p.state;
    return {
      ...p, state: PR_STATES.includes(st) ? st : '', live: l && !l.error ? l : null,
      error: l?.error || (p.id ? null : 'Sem URL/ID de PR no state.json — o watcher não consegue acompanhar este repo.'),
    };
  });
}

// Divergência entre repos irmãos, detectada no cliente. MERGED + DECLINED é a mesma
// regra que faz o watcher gravar o evento escalation; MERGED + OPEN é merge parcial
// (ex: front já em produção chamando endpoint do back que ainda está em branch).
function prInconsistency(rows) {
  if (rows.length < 2) return null;
  const by = st => rows.filter(p => p.state === st).map(p => p.repo || `#${p.id}`);
  const merged = by('MERGED'), declined = by('DECLINED'), open = by('OPEN');
  if (merged.length && declined.length) return { level: 'danger', merged, other: declined, otherState: 'DECLINED' };
  if (merged.length && open.length) return { level: 'warn', merged, other: open, otherState: 'OPEN' };
  return null;
}

function prAlertHtml(rows) {
  const inc = prInconsistency(rows);
  if (!inc) return '';
  const list = a => a.join(', ');
  const plural = a => (a.length > 1 ? 'estão' : 'está');
  return inc.level === 'danger'
    ? `<div class="pr-banner" role="alert">
        <h4>⚠ PRs Inconsistentes</h4>
        <p>${esc(list(inc.merged))} ${plural(inc.merged)} MERGED, mas ${esc(list(inc.other))} ${inc.other.length > 1 ? 'foram recusados' : 'foi recusado'} (DECLINED).</p>
        <small>O que foi mergeado pode depender de mudança que não vai entrar. Reabra ou refaça o PR recusado, ou reverta o merge.</small>
      </div>`
    : `<div class="pr-banner warn" role="status">
        <h4>⚠ PRs Inconsistentes · merge parcial</h4>
        <p>${esc(list(inc.merged))} já ${plural(inc.merged)} MERGED; ${esc(list(inc.other))} ainda ${plural(inc.other)} OPEN.</p>
        <small>Até o(s) outro(s) PR(s) entrar(em), o ambiente fica só com parte da mudança.</small>
      </div>`;
}

// Banner INTERRUPTED (status "interrupted" gravado pelo watcher no SIGTERM, ou derivado — ver node-clock.js).
function interruptedHtml(s) {
  const it = NodeClock.interruption(s);
  if (!it) return '';
  const node = NODE_LABEL[it.activeNodeAtInterruption] || it.activeNodeAtInterruption || '—';
  const text = {
    suspected: [`O nó passou do timeout (${NodeClock.fmtDuration(it.timeoutMs)}) sem terminar.`,
      'O agente provavelmente morreu. O watcher recupera este nó na próxima inicialização (commit nunca é redespachado sozinho).'],
    recovered: ['O watcher detectou este nó órfão e o devolveu para a fila.',
      'Ele é redespachado no próximo ciclo, a partir do mesmo passo. Pode haver trabalho parcial no worktree.'],
    sigterm: ['O watcher recebeu SIGTERM enquanto conduzia este nó e encerrou de forma controlada.',
      'O ciclo não é redespachado sozinho. Confira o worktree (pode haver trabalho parcial) e grave status="in_progress" no state.json para retomar.'],
    escalated: ['O commit morreu no meio e não foi redespachado.',
      'Ele pode ter feito push ou aberto PR. Confira a branch remota e os PRs, depois grave status="in_progress" no state.json para retomar.'],
  }[it.kind];
  return `<div class="pr-banner${it.kind === 'recovered' ? ' warn' : ''}" role="alert" data-kind="${esc(it.kind)}">
      <h4>INTERRUPTED</h4>
      <p>${esc(text[0])}</p>
      <div class="int-facts">
        <span>activeNodeAtInterruption <b>${esc(node)}</b></span>
        <span>interruptedAt <b title="${esc(it.interruptedAt || '')}">${esc(it.interruptedAt ? when(it.interruptedAt) : '—')}</b></span>
        ${it.detectedAt ? `<span>Detectado <b title="${esc(it.detectedAt)}">${esc(when(it.detectedAt))}</b></span>` : ''}
      </div>
      <small>${esc(text[1])}</small>
    </div>`;
}

// Relógio ao vivo: só reescreve o texto/classe dos contadores, sem re-renderizar o
// detalhe. Ao cruzar 100% do timeout, re-renderiza uma vez pra aparecer o banner.
setInterval(() => {
  if (document.hidden) return;
  const now = Date.now();
  for (const el of document.querySelectorAll('[data-node-clock]')) {
    const started = Number(el.dataset.started), timeout = Number(el.dataset.timeout);
    const elapsed = Math.max(0, now - started);
    el.textContent = NodeClock.fmtDuration(elapsed);
    const lvl = NodeClock.levelOf(elapsed / timeout);
    const station = el.closest('.station');
    station.classList.remove('lvl-warn', 'lvl-hot', 'lvl-over');
    if (lvl) station.classList.add(`lvl-${lvl}`);
    if (lvl === 'over' && !document.querySelector('#intBanner [data-kind]')) renderDetail();
  }
}, 1000);

// ---------------------------------------------------------------- sidebar
let lastRunsHash = '';
function setRuns(list) {
  const hash = JSON.stringify(list);
  const changed = hash !== lastRunsHash;
  lastRunsHash = hash;
  runs.clear();
  for (const r of list) runs.set(r.taskId, r);
  if (!selected) {
    const want = prefs.selected && runs.has(prefs.selected) && !isHidden(runs.get(prefs.selected)) ? prefs.selected : null;
    if (want) { select(want, { quiet: true }); return; }
  }
  renderSidebar({ views: changed });
  renderDetail();
  updateTitle();
}

// Remover da lista = ocultar só neste navegador. O run volta sozinho quando tiver
// novidade (updated_at mais novo que o do momento em que foi removido).
function isHidden(r) {
  if (!(r.taskId in prefs.hidden)) return false;
  const at = prefs.hidden[r.taskId];
  if (r.updatedAt && at && Date.parse(r.updatedAt) > Date.parse(at)) {
    delete prefs.hidden[r.taskId]; persist();
    return false;
  }
  return true;
}
function hideRuns(ids) {
  for (const id of ids) prefs.hidden[id] = runs.get(id)?.updatedAt || new Date(0).toISOString();
  persist();
}
function unhideRuns(ids) {
  for (const id of ids) delete prefs.hidden[id];
  persist();
}

function updateTitle() {
  const n = [...runs.values()].filter(r => !isHidden(r) && needsYou(r)).length;
  document.title = n ? `(${n}) Espectro — Dashboard` : 'Espectro — Dashboard';
}

function visibleRuns() {
  const q = $('q').value.trim().toLowerCase();
  const list = [...runs.values()];
  if (!q) return list;
  return list.filter(r => {
    const t = titleOf(r);
    return `${t.num} ${t.text} ${r.taskId}`.toLowerCase().includes(q);
  });
}

function sidebarBar(list) {
  if (!selecting) {
    const anyOpen = GROUPS.some(g => groupOpen(g) && list.some(r => (g.hidden ? isHidden(r) : !isHidden(r) && g.match(r))));
    return `<div class="side-bar"><span class="label">Runs</span><span class="spacer"></span>
      <button class="ghost-btn" type="button" data-act="${anyOpen ? 'collapse' : 'expand'}">${anyOpen ? 'Recolher tudo' : 'Expandir tudo'}</button>
      <button class="ghost-btn" type="button" data-act="compare-mode" title="Escolha 2 runs para ver as diferenças lado a lado">Comparar</button>
      <button class="ghost-btn" type="button" data-act="select" title="Ou ⌘/Ctrl+clique num run">Selecionar</button></div>`;
  }
  const ids = list.map(r => r.taskId);
  const n = ids.filter(id => picked.has(id)).length;
  if (compareMode) {
    return `<div class="side-bar"><span class="picked">${picked.size} de ${COMPARE_MAX} para comparar</span>
      <span class="spacer"></span>
      <button class="ghost-btn" type="button" data-act="cancel">Cancelar</button></div>`;
  }
  const cls = n === 0 ? '' : n === ids.length ? 'on' : 'some';
  return `<div class="side-bar">
    <button class="check-btn" type="button" data-act="all" aria-label="${n === ids.length ? 'Desmarcar todos' : 'Marcar todos'}"><span class="check ${cls}">${cls === 'on' ? ICON.box : ''}</span></button>
    <span class="picked">${n ? `${n} selecionado${n > 1 ? 's' : ''}` : 'Nenhum selecionado'}</span>
    <span class="spacer"></span>
    <button class="ghost-btn" type="button" data-act="cancel">Cancelar</button></div>`;
}

function actionBar() {
  if (!selecting) return '';
  if (compareMode) {
    const n = [...picked].filter(id => runs.has(id)).length;
    return `<div class="action-bar compare-bar">
      <span class="what">${n === COMPARE_MAX ? '2 runs selecionados' : `Selecione ${COMPARE_MAX - n} run${COMPARE_MAX - n > 1 ? 's' : ''}`}</span>
      <button class="primary compare-go" type="button" data-act="compare" ${n === COMPARE_MAX ? '' : 'disabled aria-disabled="true"'}>Comparar</button>
      <span class="fine">O mais antigo vira Run A. Só leitura: nenhum arquivo de run é alterado.</span></div>`;
  }
  const ids = [...picked].filter(id => runs.has(id));
  const hiddenIds = ids.filter(id => isHidden(runs.get(id)));
  const shownIds = ids.filter(id => !hiddenIds.includes(id));
  if (!ids.length) {
    return `<div class="action-bar"><span class="what">Clique nos runs para selecionar.</span>
      <span class="fine">Shift+clique seleciona um intervalo. Remover só tira da lista: o watcher e os arquivos continuam iguais.</span></div>`;
  }
  return `<div class="action-bar">
    <span class="what">${ids.length} run${ids.length > 1 ? 's' : ''}</span>
    ${hiddenIds.length ? `<button class="restore" type="button" data-act="restore">Voltar para a lista (${hiddenIds.length})</button>` : ''}
    ${shownIds.length ? `<button class="primary" type="button" data-act="hide">Remover da lista (${shownIds.length})</button>` : ''}
    <span class="fine">Só some deste dashboard. O run volta sozinho se tiver novidade.</span></div>`;
}

// views: false => só a lista lateral (evento ao vivo sem mudança real nos dados não
// re-renderiza a aba ativa inteira — tabelas grandes piscavam a cada evento).
function renderSidebar({ views = true } = {}) {
  if (views) window.Views?.refresh();
  const list = visibleRuns();
  const q = $('q').value.trim();
  const side = $('sidebar');
  side.classList.toggle('selecting', selecting);
  const keep = side.scrollTop;
  if (!runs.size) {
    side.innerHTML = '<div class="side-empty">Nenhum run encontrado em memory/runs. Quando o watcher pegar um ticket, ele aparece aqui sozinho.</div>';
    return;
  }
  if (!list.length) {
    side.innerHTML = sidebarBar(list) + `<div class="side-empty">Nada bate com “${esc(q)}”. Tente o número do ticket.</div>`;
    return;
  }
  let html = sidebarBar(list);
  const shown = list.filter(r => !isHidden(r));
  const hidden = list.filter(r => isHidden(r));
  for (const g of GROUPS) {
    const items = g.hidden ? hidden : shown.filter(g.match);
    if (!items.length) continue;
    const open = groupOpen(g);
    const hasSel = !open && items.some(r => r.taskId === selected);
    const title = `<button class="group-head ${g.cls || ''}" type="button" data-group="${g.key}" aria-expanded="${open}">
      ${ICON.chevLeft}<span class="g-dot ${GROUP_TONE[g.key] || 'queued'}" aria-hidden="true"></span>${g.label} <span class="count">${items.length}</span>${hasSel ? '<span class="sel-dot" title="O run aberto está neste grupo"></span>' : ''}</button>`;
    if (selecting && !compareMode) {
      const n = items.filter(r => picked.has(r.taskId)).length;
      const cls = n === 0 ? '' : n === items.length ? 'on' : 'some';
      html += `<div class="group-row"><button class="check-btn" type="button" data-pick-group="${g.key}" aria-label="Selecionar grupo ${esc(g.label)}"><span class="check ${cls}">${cls === 'on' ? ICON.box : ''}</span></button>${title}</div>`;
    } else {
      html += title;
    }
    if (open) html += items.map(runRow).join('');
  }
  html += actionBar();
  side.innerHTML = html;
  side.scrollTop = keep;
}

function groupItems(key) {
  const list = visibleRuns();
  if (key === 'hidden') return list.filter(r => isHidden(r));
  const g = GROUPS.find(x => x.key === key);
  return list.filter(r => !isHidden(r) && g.match(r));
}

// Ordem visual dos runs na lista (pra Shift+clique selecionar intervalo).
function rowOrder() { return [...document.querySelectorAll('#sidebar .run')].map(b => b.dataset.id); }

function togglePick(id, range) {
  if (compareMode) {
    if (picked.has(id)) picked.delete(id);
    else if (picked.size >= COMPARE_MAX) toast(`Máximo de ${COMPARE_MAX} runs para comparar. Desmarque um antes.`);
    else picked.add(id);
    return;
  }
  if (range && lastPicked) {
    const order = rowOrder();
    const a = order.indexOf(lastPicked), b = order.indexOf(id);
    if (a !== -1 && b !== -1) {
      const on = !picked.has(id);
      for (const x of order.slice(Math.min(a, b), Math.max(a, b) + 1)) on ? picked.add(x) : picked.delete(x);
      lastPicked = id;
      return;
    }
  }
  picked.has(id) ? picked.delete(id) : picked.add(id);
  lastPicked = id;
}

function setSelecting(on, { compare = false } = {}) {
  selecting = on;
  if (compareMode !== (on && compare)) { picked.clear(); lastPicked = null; }
  compareMode = on && compare;
  if (!on) { picked.clear(); lastPicked = null; }
  renderSidebar();
}

function applyHide() {
  const ids = [...picked].filter(id => runs.has(id) && !isHidden(runs.get(id)));
  if (!ids.length) return;
  hideRuns(ids);
  if (ids.includes(selected)) { selected = null; prefs.selected = null; persist(); renderDetail(); }
  setSelecting(false); updateTitle();
  toast(`${ids.length} run${ids.length > 1 ? 's removidos' : ' removido'} da lista.`, {
    label: 'Desfazer', run: () => { unhideRuns(ids); renderSidebar(); updateTitle(); },
  });
}

function applyRestore() {
  const ids = [...picked].filter(id => runs.has(id) && isHidden(runs.get(id)));
  if (!ids.length) return;
  unhideRuns(ids);
  setSelecting(false); updateTitle();
  toast(`${ids.length} run${ids.length > 1 ? 's voltaram' : ' voltou'} para a lista.`);
}

// Andamento em 7 pontinhos (feito / atual / pendente) — lido de relance na lista.
function miniRail(r) {
  if (!r.nodes) return '';
  const dots = NODES.map(([k, label]) => {
    const cur = r.status !== 'committed' && r.node === k;
    const cls = cur ? (needsYou(r) ? 'cur stop' : 'cur') : r.nodes[k] === 'done' || r.status === 'committed' ? 'done' : '';
    return `<i class="${cls}"></i>`;
  }).join('');
  const label = NODES.map(([k, l]) => l).join(' → ');
  return `<span class="mini-rail" title="${esc(label)}" aria-hidden="true">${dots}</span>`;
}

// Totais do run no cabeçalho do detalhe (mesma fonte do fold Custo). Sem cost_tracking = nada;
// contador ausente aparece como "—", nunca 0.
function heroCost(r) {
  const tt = costOf(r)?.totals;
  if (!tt) return '';
  const tok = tt.input_tokens == null && tt.output_tokens == null ? null : (tt.input_tokens || 0) + (tt.output_tokens || 0);
  return `<span class="hero-cost" title="Totais medidos pelo watcher · fonte: cost_tracking do state.json">${esc(fmtUsd(tt.cost_usd ?? null))} · ${esc(fmtTok(tok))} tokens · ${esc(fmtMs(tt.duration_ms))}</span>`;
}
// Custo total do run (state.json cost_tracking, medido pelo watcher). Sem medição = nada.
function runCost(r) {
  const usd = costOf(r)?.totals?.cost_usd;
  return usd == null ? '' : `<span class="run-cost" title="Custo estimado do run · fonte: cost_tracking do state.json (watcher)">${esc(fmtUsd(usd))}</span>`;
}

function runRow(r) {
  const t = titleOf(r);
  const q = $('q').value.trim();
  const twin = [...runs.values()].some(o => o !== r && titleOf(o).num === t.num && titleOf(o).text === t.text);
  const slug = twin ? r.taskId.replace(/^\d{4,6}-/, '') : '';
  const prs = extractPrs(r.state?.pull_request);
  const where = r.archived ? `${r.demand?.status || 'Aberto'} no Redmine` : r.status === 'committed' ? 'Commitado' : r.state?.status === 'spec-draft' ? 'Spec rascunho em revisão' : r.state?.status === 'spec-change-pending-approval' ? 'SPEC_CHANGE aguardando você' : r.status === 'awaiting_approval' ? 'Draft da spec no Redmine' : r.node === 'escalated' ? 'Escalado para você' : r.node ? `${r.state?.status === 'running' ? 'Rodando' : r.status === 'running' ? 'Próximo' : 'Parado em'}: ${NODE_LABEL[r.node] || r.node}` : '';
  return `
    <div class="run ${picked.has(r.taskId) ? 'picked' : ''} ${isHidden(r) ? 'hidden-run' : ''} ${r.qaRejected ? 'qa-rejected' : ''}" role="button" tabindex="0" data-id="${esc(r.taskId)}"
      aria-current="${r.taskId === selected}" ${selecting ? `aria-pressed="${picked.has(r.taskId)}"` : ''}>
      ${selecting
        ? `<span class="check ${picked.has(r.taskId) ? 'on' : ''}">${ICON.box}</span>`
        : stateGlyph(r.status)}
      <span class="title">${t.num ? `<span class="ticket">${highlight(t.num, q)}</span>` : ''}${highlight(t.text, q)}${isHighRisk(r) ? RISK_BADGE : ''}${churnBadge(r)}${r.status === 'awaiting_approval' ? APPROVAL_BADGE : ''}${specBadge(r)}${qaBadge(r)}${qaRetryBlockedBadge(r)}${routingBlockedBadge(r)}${!r.qaRejected ? ticketStatusBadge(r.ticketStatus) : ''}${sessionLimitBadge(r)}</span>
      <span class="when" title="${esc(when(r.updatedAt))}">${esc(ago(r.updatedAt))}</span>
      ${svcChips(r) ? `<span class="svcs" aria-label="Serviços afetados">${svcChips(r, { max: 3 })}</span>` : ''}
      <span class="sub">${miniRail(r)}${schemaBadge(r) ? `<span>${schemaBadge(r)}</span>` : ''}${prs.length ? `<span>${prBadge(r.taskId, prs[0])}${prs.length > 1 ? ` <span class="pr-more">+${prs.length - 1}</span>` : ''}</span>` : ''}<span class="where">${esc(where)}</span>${slug ? `<span class="slug">${highlight(slug, q)}</span>` : ''}${r.pendingHumanInput ? '<span class="mail">Mensagem na fila</span>' : ''}${window.RunSubtasks?.chipHtml(costOf(r)) || ''}${runCost(r)}</span>
      ${qaActions(r)}
      ${sessionLimitActions(r)}
    </div>`;
}

// Recusa QA (server.js > summarize: qaRejected/qaRetryCount/qaRetryPending/qaRetryBlocked).
// O botão só existe com o ticket em Recusa QA; busy/erro ficam aqui porque a lista
// re-renderiza a cada state_update do WebSocket. PRI-184: qaRetryBlocked torna visível
// o sinal parado (não confundir com implement saudável).
const qaRetry = new Map(); // taskId -> { busy, error }
const QA_RETRY_BLOCKED_LABEL = {
  destino_ocupado: 'Destino do run ocupado',
  spec_ausente: 'Spec ausente ou ilegível',
  changelog_invalido: 'Changelog / Branch Liberação inválida',
  state_fora_schema: 'State fora do schema',
  ticket_ausente: 'Ticket Redmine ausente',
  worktree_ausente: 'Worktree indisponível',
};
function qaRetryBlockedInfo(r) {
  const b = r.qaRetryBlocked;
  if (!b || typeof b.reason !== 'string') return null;
  // Só enquanto o sinal ainda está no disco (retry parado de verdade).
  if (!r.qaRetryPending) return null;
  return b;
}
function qaBadge(r) {
  const tip = r.state?.qa_rejection?.note ? `Nota do QA: ${r.state.qa_rejection.note}` : 'Ticket recusado pelo QA no Redmine';
  return (r.qaRejected ? `<span class="qa-badge" title="${esc(tip)}">⊘ RECUSADA QA</span>` : '');
}
function qaRetryBlockedBadge(r) {
  const b = qaRetryBlockedInfo(r);
  if (!b) return '';
  const label = QA_RETRY_BLOCKED_LABEL[b.reason] || b.reason;
  const tip = `Retry QA bloqueado: ${label}${b.at ? ` · ${b.at}` : ''}`;
  return `<span class="qa-blocked-badge" title="${esc(tip)}">⚠ RETRY BLOQUEADO</span>`;
}
// PRI-233 T9: admissão recusada por roteamento ON com configuração inválida
// (server.js > summarize: routingBlocked). Mesmo estilo do aviso de retry bloqueado.
function routingBlockedBadge(r) {
  const b = r.routingBlocked;
  if (!b || typeof b.cause !== 'string') return '';
  const tip = `Roteamento ON inválido: ${b.cause}${b.detail ? ` (${b.detail})` : ''}. ` +
    `Corrija ${b.configFile} ou use mode OFF para admitir Runs novas.` +
    (b.notifiedAt ? ` Avisado em ${b.notifiedAt}.` : (b.transient ? ' Leitura transitória: aviso após repetição.' : ''));
  return `<span class="qa-blocked-badge" title="${esc(tip)}">⚠ ADMISSÃO BLOQUEADA</span>`;
}
function qaRetryBlockedMsg(r) {
  const b = qaRetryBlockedInfo(r);
  if (!b) return '';
  const label = QA_RETRY_BLOCKED_LABEL[b.reason] || b.reason;
  return `<span class="qa-blocked-msg" role="status">Retry bloqueado: ${esc(label)}${b.at ? ` · ${esc(when(b.at))}` : ''}</span>`;
}
// Total de recusas do run (retries + a pendente); sem qaCycles, cai no contador de retries.
function qaRejectionCount(r) {
  const q = r.qaCycles;
  return q ? q.cycles.length + (q.pending ? 1 : 0) : (r.qaRetryCount || 0) + (r.qaRejected ? 1 : 0);
}
function qaActions(r) {
  const n = qaRejectionCount(r);
  const count = n ? `<span class="qa-count" title="Detalhes no painel Recusas QA do run">${n} recusa${n > 1 ? 's' : ''} QA</span>` : '';
  const blocked = qaRetryBlockedMsg(r);
  if (!r.qaRejected) {
    if (!count && !blocked) return '';
    return `<span class="qa-actions">${blocked || ''}${count}</span>`;
  }
  const st = qaRetry.get(r.taskId) || {};
  const blockedInfo = qaRetryBlockedInfo(r);
  const busy = st.busy || (r.qaRetryPending && !blockedInfo);
  return `<span class="qa-actions">
      <button type="button" class="qa-retry-btn" data-qa-retry="${esc(r.taskId)}" ${busy || blockedInfo ? 'disabled aria-busy="true"' : ''}>
        ${blockedInfo ? '⚠ Retry bloqueado' : busy ? '<span class="qa-spinner" aria-hidden="true"></span> Iniciando retry…' : '🔄 Corrigir recusa QA'}</button>
      ${blocked}${count}${st.error ? `<span class="qa-err" role="alert">${esc(st.error)}</span>` : ''}
    </span>`;
}
async function retryQaRejection(taskId) {
  if (qaRetry.get(taskId)?.busy) return;
  qaRetry.set(taskId, { busy: true });
  renderSidebar();
  if (selected === taskId) renderDetail();
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(taskId)}/retry-qa-rejection`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: casBody(taskId),
    });
    const body = await res.json().catch(() => ({}));
    if (StateVersion.isConflict(res.status, body)) markStale(taskId);
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    qaRetry.delete(taskId);
    const r = runs.get(taskId);
    if (r) {
      // Até o state_update chegar: sai da Recusa QA e o próximo nó vira implement.
      Object.assign(r, { qaRejected: false, ticketStatus: body.ticket_status, qaRetryCount: body.qa_retry_count, node: 'implement', status: 'running' });
      if (r.state) Object.assign(r.state, { node: 'implement', status: 'in_progress', ticket_status: body.ticket_status, qa_retry_count: body.qa_retry_count });
      if (r.demand) r.demand.status = body.ticket_status;
    }
    toast('Retry QA iniciado');
  } catch (e) {
    qaRetry.set(taskId, { error: `Não deu para iniciar o retry: ${e.message}` });
  }
  renderSidebar();
  if (selected === taskId) renderDetail();
}

// session_limit (server.js > runStatus + POST /api/runs/:taskId/resume-session):
// lê r.state.status BRUTO (sub-status), não r.status (coarseado por runStatus() —
// não tem bucket próprio pra session_limit), mesmo padrão de pre-build-failed. O
// botão só existe com a sessão interrompida; busy/erro/ok ficam aqui como no
// qaRetry acima, mas sem otimismo em r.state — o card só sai de session_limit
// quando o state_update de verdade chegar (o sucesso mostra "sessão retomada ✓"
// no lugar do botão nesse meio-tempo, em vez de o card sumir antes da hora).
const sessionResume = new Map(); // taskId -> { busy, error, ok }
function sessionLimitBadge(r) {
  if (r.state?.status !== 'session_limit') return '';
  const node = r.state?.interrupted_node || r.node || '?';
  return `<span class="session-limit-badge" title="Sessão interrompida por limite de contexto/tokens no nó ${esc(node)}">⏸ SESSÃO LIMITE</span>`;
}
function sessionLimitActions(r) {
  if (r.state?.status !== 'session_limit') return '';
  const st = sessionResume.get(r.taskId) || {};
  const n = r.state?.resume_count || 0;
  const count = n > 0 ? `<span class="qa-count">Retomada ${n}/3</span>` : '';
  return `<span class="resume-actions">
      <button type="button" class="resume-session-btn" data-resume-session="${esc(r.taskId)}" ${st.busy ? 'disabled aria-busy="true"' : ''}>
        ${st.busy ? '<span class="qa-spinner" aria-hidden="true"></span> retomando…' : '▶ Retomar sessão'}</button>
      ${count}${st.ok ? '<span class="resume-ok">sessão retomada ✓</span>' : ''}${st.error ? `<span class="resume-err" role="alert">${esc(st.error)}</span>` : ''}
    </span>`;
}
async function resumeSession(taskId) {
  if (sessionResume.get(taskId)?.busy) return;
  sessionResume.set(taskId, { busy: true });
  renderSidebar();
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(taskId)}/resume-session`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: casBody(taskId),
    });
    if (res.status === 429) throw new Error('limite de retomadas atingido');
    const body = await res.json().catch(() => ({}));
    if (StateVersion.isConflict(res.status, body)) { markStale(taskId); throw new Error(StateVersion.MESSAGE); }
    if (!res.ok) throw new Error('erro ao retomar');
    sessionResume.set(taskId, { ok: true });
  } catch (e) {
    const known = ['limite de retomadas atingido', StateVersion.MESSAGE];
    sessionResume.set(taskId, { error: known.includes(e.message) ? e.message : 'erro ao retomar' });
  }
  renderSidebar();
}

$('sidebar').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'select') return setSelecting(true);
  if (act === 'compare-mode') return setSelecting(true, { compare: true });
  if (act === 'compare') {
    const ids = [...picked].filter(id => runs.has(id));
    if (ids.length !== COMPARE_MAX) return;
    setSelecting(false);
    return window.Compare?.open(ids);
  }
  if (act === 'cancel') return setSelecting(false);
  if (act === 'hide') return applyHide();
  if (act === 'restore') return applyRestore();
  if (act === 'all') {
    const ids = visibleRuns().map(r => r.taskId);
    const all = ids.every(id => picked.has(id));
    ids.forEach(id => all ? picked.delete(id) : picked.add(id));
    return renderSidebar();
  }
  const pg = e.target.closest('[data-pick-group]');
  if (pg) {
    const ids = groupItems(pg.dataset.pickGroup).map(r => r.taskId);
    const all = ids.every(id => picked.has(id));
    ids.forEach(id => all ? picked.delete(id) : picked.add(id));
    setGroupOpen(pg.dataset.pickGroup, true);
    return renderSidebar();
  }
  const g = e.target.closest('[data-group]');
  if (g) { setGroupOpen(g.dataset.group, g.getAttribute('aria-expanded') !== 'true'); renderSidebar(); return; }
  if (act === 'collapse' || act === 'expand') {
    for (const x of GROUPS) setGroupOpen(x.key, act === 'expand');
    return renderSidebar();
  }
  const qb = e.target.closest('[data-qa-retry]');
  if (qb) { if (!qb.disabled) retryQaRejection(qb.dataset.qaRetry); return; } // não seleciona a linha
  const rb = e.target.closest('[data-resume-session]');
  if (rb) { if (!rb.disabled) resumeSession(rb.dataset.resumeSession); return; } // não seleciona a linha
  if (e.target.closest('a')) return; // badge de PR abre em nova aba, não seleciona
  const row = e.target.closest('.run');
  if (!row) return;
  if (!selecting && (e.metaKey || e.ctrlKey || e.shiftKey)) { selecting = true; picked.clear(); if (e.shiftKey && selected) lastPicked = selected; }
  if (selecting) { togglePick(row.dataset.id, e.shiftKey); renderSidebar(); return; }
  select(row.dataset.id);
});
$('sidebar').addEventListener('keydown', e => {
  const row = e.target.closest('.run');
  if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
});
$('q').addEventListener('input', () => { searchOverride = {}; renderSidebar(); });

function select(taskId, { quiet } = {}) {

  selected = taskId;
  prefs.selected = taskId; persist();
  contextText = ''; contextFor = null; ctxQuery = '';
  renderSidebar(); renderDetail(); updateTitle();
